apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agent-studio
spec:
  generators:
    - git:
        repoURL: https://github.com/opspresso/argocd-env-apps.git
        revision: HEAD
        files:
          - path: "env/eks-demo.yaml"

  template:
    metadata:
      name: "agent-studio-{{cluster}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: /charts/agent-studio
      labels:
        app.kubernetes.io/instance: "apps-{{cluster}}"
        opspresso.com/cluster: "{{cluster}}"
        opspresso.com/group: "apps"
    spec:
      project: apps
      destination:
        name: "{{cluster}}"
        namespace: agent-studio
      source:
        repoURL: https://github.com/opspresso/argocd-env-apps
        targetRevision: HEAD
        path: charts/agent-studio
        helm:
          valueFiles:
            - values.yaml
            - "values-{{phase}}.yaml"
            - "{{env}}/values-{{cluster}}.yaml"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # Retry transient failures, such as a CR applied before its CRD exists.
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
