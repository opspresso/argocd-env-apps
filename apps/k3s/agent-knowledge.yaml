apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-knowledge-k3s
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: noti-argocd-k3s
  labels:
    app.kubernetes.io/instance: apps-k3s-demo
    opspresso.com/cluster: k3s-demo
    opspresso.com/group: apps
spec:
  project: apps
  destination:
    name: in-cluster
    namespace: agent-knowledge
  source:
    repoURL: https://github.com/opspresso/argocd-env-apps
    targetRevision: HEAD
    path: charts/agent-knowledge
    helm:
      valueFiles:
      - values.yaml
      - values-alpha.yaml
      - k3s/values-k3s-demo.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
