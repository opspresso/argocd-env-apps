# Cluster
cluster: eks-demo
env: eks
phase: prod
group: eks-demo
role: mgmt
country: kr

# AWS
aws_account_id: "396608815058"
aws_region: ap-northeast-2

# Network
hostname:
  internal: demo-in.opsp.dev
  public: demo.opsp.dev
  this: demo-0.opsp.dev
trusted_proxy_cidrs:
- 10.10.0.0/16

# Capacity
replicas: 1
autoscaling: true
resources: true
# Critical services run on the on-demand core NodePools (terraform-env-demo demo/6-eks-node/51-core-node-pool.tf):
# PostgreSQL requires them, the Agent services and rovr prefer them.
core_tier: true

# Observability
metrics:
  backend: prometheus
grafana_url: http://grafana.addon-grafana.svc.cluster.local

# Maintenance
agent_studio_maintenance: false
agent_memory_maintenance: true
agent_knowledge_maintenance: false
agent_forge_maintenance: false
agent_models_maintenance: false
agent_runway_maintenance: false
rovr_maintenance: false

# Data stores
postgresql:
  max_connections: 550
  storage: 20Gi
  storageClass: gp3
delivery_pool:
  storage: 10Gi
  storageClass: gp3

# Agent Studio
agent_studio:
  service:
    name: Agent Studio
    logo: agent-studio
    copyright: © OpsPresso. All rights reserved.
  hostname: studio.agrt.dev
  allowed_hosts:
  - studio.agrt.dev
  # Platform sign-in: the Dex client agent-studio (argocd-env-addons charts/dex).
  # One Dex session serves the addons and Studio; the Agent services sign in
  # through Studio. argocd-env-addons install/eks/secrets.sh creates
  # /k8s/eks-demo/agent-studio/oidc-client-id and oidc-client-secret.
  oidc:
    issuer: https://sso.demo.opsp.dev
    provider_id: lldap
    display_name: LLDAP
    # Dex sessions store the claims of the latest direct sign-in and reuse them
    # for SSO into every other client. Without groups here, a Studio sign-in
    # erases the LLDAP groups that Argo CD, Grafana and GitLab receive.
    scopes: openid email profile groups
    # Dex passes only name, email and groups from LLDAP, so the company profile
    # comes from LLDAP group names: org-<company>, dept-<department>,
    # title-<job title> and role-<role>. Other groups except LLDAP's own
    # lldap_* are teams. One company, department and title per person.
    profile_claims:
      company: {claim: /groups, match: '^org-(.+)$'}
      department: {claim: /groups, match: '^dept-(.+)$'}
      jobTitle: {claim: /groups, match: '^title-(.+)$'}
      roles: {claim: /groups, match: '^role-(.+)$'}
      teams: {claim: /groups, match: '^(?!lldap_|org-|dept-|title-|role-).+$'}
    # LLDAP sign-in links to the Studio account with the same email. Safe only
    # because users cannot change their own LLDAP email: the LLDAP UI admits
    # only sso.admin_groups (argocd-env-addons charts/lldap).
    trust_email: true
  # Git hosts whose accounts users connect in Studio (Profile > Git accounts). client_id is the OAuth application on
  # that host, with the redirect URI https://<hostname>/api/git/callback; its client secret is the key <name> of the
  # JSON in /k8s/<cluster>/agent-studio/git-host-secrets. github: the OAuth App agent-studio-git of the opspresso
  # organization. gitlab: the user application Agent Studio on gitlab.com. gitlab-demo: gitlab.oauth_applications in
  # argocd-env-addons env/eks-demo.yaml.
  git_hosts:
    - name: github
      provider: github
      origin: https://github.com
      client_id: Ov23liWo0mJ9kFk43v9N
    - name: gitlab
      provider: gitlab
      origin: https://gitlab.com
      client_id: 2ecdaea4aa0015547c53779a63d5419b3d09a5adb3d80e760d282f84afb9aef4
    - name: gitlab-demo
      provider: gitlab
      origin: https://gitlab.demo.opsp.dev
      client_id: agent-studio-git
  # Central selection IDs; Studio's saved overrides take precedence until reset in Settings.
  model_usage:
    defaultModel: openrouter/deepseek-v4.1-flash
    decisionModel: openrouter/jev-1.14
    embeddingModel: openrouter/text-embedding-3-small
    rerankerModel: openrouter/rerank-v3.5
    modelRouting:
      tiers:
        fast: openrouter/gpt-6-luna
        general: openrouter/deepseek-v4.1-flash
        coding: openrouter/deepseek-v4.1-flash
        reasoning: openrouter/glm-5.3
        vision: openrouter/deepseek-v4.1-flash
      policies: {}
      localOnly: false
      maxCallCostUsd: 0
      maxRunCostUsd: 0
      maxCalls: 0
      minOutputChars: 1
workspace_max_pods: 32
workspace_memory_mb: 2048
workspace_disk_mb: 2048
workspace_cpus: 1

# Agent services
agent_memory:
  hostname: memory.agrt.dev
  allowed_hosts:
  - memory.agrt.dev
  # Agent Models selection IDs (<provider>/<model>) enabled in this installation.
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    decision: openrouter/jev-1.14
    dream: openrouter/gpt-6.1-sol

agent_knowledge:
  hostname: knowledge.agrt.dev
  allowed_hosts:
  - knowledge.agrt.dev
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    extraction: openrouter/gpt-6-luna
    verification: openrouter/deepseek-v4.1-flash
    transcription: openrouter/mai-transcribe-2
    summary: openrouter/deepseek-v4.1-flash

agent_forge:
  hostname: forge.agrt.dev
  # Runtime channels contain only Models selection IDs. Saved profiles choose their own model.
  model_roles:
  - {id: openrouter/minimax-m3.1-flash, runtime: opencode, model: openrouter/minimax-m3.1-flash, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}
  - {id: openrouter/deepseek-v4.1-flash, runtime: opencode, model: openrouter/deepseek-v4.1-flash, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}
  - {id: openrouter/glm-5.3, runtime: opencode, model: openrouter/glm-5.3, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}
  - {id: openrouter/gpt-6-luna, runtime: opencode, model: openrouter/gpt-6-luna, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}
  # Preserve channels referenced by existing workspaces; they are not the default profiles.
  - {id: openrouter/gpt-6.1-sol, runtime: opencode, model: openrouter/gpt-6.1-sol, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}
  - {id: openrouter/gpt-6-astra, runtime: opencode, model: openrouter/gpt-6-astra, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}
  - {id: openrouter/claude-opus-5.5, runtime: opencode, model: openrouter/claude-opus-5.5, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}
  - {id: openrouter/claude-sonnet-5.5, runtime: opencode, model: openrouter/claude-sonnet-5.5, protocol: chat/completions, maxOutputTokens: 8192, maxRequestsPerRun: 100}

agent_models:
  hostname: models.agrt.dev

agent_runway:
  hostname: runway.agrt.dev
  # Studio and Forge use Agent Runway only after Studio has issued its OIDC client and the service is running.
  connected: true
  # App Delivery: argocd-env-projects declares the WorkflowTemplates (app-build, app-deploy, resource-sync, the
  # Agent Runway defaults) and the per-environment Applications.
  delivery:
    namespace: app-delivery
    domain: apps.rovr.dev
    argocd_domain: demo.opsp.dev
    # The environments the first boot stores (agent-platform docs/APP_DELIVERY.md), rendered as RUNWAY_ENVIRONMENTS;
    # later changes are made in the Agent Runway console and need no change here. The first boot also makes the
    # pipeline `default` with these environments in this order; administrators set triggers, promotion order and
    # sizes in pipelines.
    environments:
      - {name: dev, approval: none, sandbox: true}
      - {name: prod, approval: owner, sandbox: false}

# Applications
# rovr: goal-driven coding agents (opspresso/rovr).
rovr:
  hostname: rovr.dev
  github_app_slug: rovr-app
  # GitHub logins that may sign in; rovr is private to them.
  allowed_logins: []
  # GitHub logins that may change anything and use the Helper; others read.
  operator_logins: [nalbam,yujh404]
  # The repository whose workflow proposes coding tool updates.
  tools_repo: opspresso/rovr
  sandbox:
    # Running sandbox Jobs at once, across all accounts. Each takes 2 CPU and 4Gi.
    max_runs: 6
    # Task disks kept between runs (one per open task).
    max_workspaces: 24
    disk: 10Gi
    # Task disks end with their task, so their EBS volumes go with them.
    storage_class: gp3-ephemeral
    # terraform-env-demo 6-eks-node: tainted rovr.dev/sandbox, DefaultDeny network policy.
    node_pool: rovr-sandboxes
    # terraform-env-opsp 8-rovr: shared package and runtime cache on EFS.
    cache:
      file_system_id: fs-0eb3767a177294715
      access_point_id: fsap-02ca3faf77d338014
      size: 50Gi

# Apps that Agent Runway deploys. Agent Runway chooses each host: <slug>.<domain> for the last stage of the Project's
# pipeline and <slug>-<env>.<domain> for the others, or <slug>-<env>.<domain> for every stage when the Project asks
# for it (terraform-env-demo 3-alb issues the wildcard certificate).
app_delivery:
  enabled: true
  domain: apps.rovr.dev
  # No list of environments lives here: Agent Runway owns them (its console), and every projects/<slug>/<env>
  # directory it writes in argocd-env-projects gets an Application.
  # The Kubernetes API server (Service IP and control plane endpoints) that Delivery runner Pods may reach.
  # Check after a control plane change: kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes
  api_server_cidrs: [172.20.0.1/32, 10.10.114.40/32, 10.10.149.55/32]
