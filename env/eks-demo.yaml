cluster: eks-demo
country: kr
env: eks
metrics:
  backend: prometheus
phase: prod
group: eks-demo
role: mgmt
replicas: 1
autoscaling: true
agent_studio_maintenance: false
agent_memory_maintenance: false
resources: true
trusted_proxy_cidrs:
- 10.10.0.0/16
grafana_url: http://grafana.addon-grafana.svc.cluster.local
aws_account_id: '396608815058'
aws_region: ap-northeast-2
hostname:
  internal: demo-in.rovr.dev
  public: demo.rovr.dev
  this: demo-0.rovr.dev
agent_studio:
  service:
    key: agentops
    name: Agent Studio
    logo: agent-studio
    copyright: © OpsPresso. All rights reserved.
  hostname: studio.agrt.dev
  allowed_hosts:
  - studio.agrt.dev
agent_memory:
  hostname: memory.agrt.dev
  allowed_hosts:
  - memory.agrt.dev
  # Agent Models selection IDs (<provider>/<model>) enabled in this installation.
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    decision: openrouter/jev-1.13
    dream: openrouter/gpt-6-luna
workspace_max_pods: 32
workspace_memory_mb: 2048
workspace_disk_mb: 2048
workspace_cpus: 1
postgresql:
  max_connections: 550
  storage: 20Gi
  storageClass: gp3
agent_knowledge:
  hostname: knowledge.agrt.dev
  allowed_hosts:
  - knowledge.agrt.dev
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    extraction: openrouter/gpt-6-luna
    transcription: openrouter/gpt-4o-transcribe
    summary: openrouter/gpt-6.1-sol
agent_forge:
  hostname: forge.agrt.dev
  allowed_hosts:
  - forge.agrt.dev
agent_knowledge_maintenance: false
agent_forge_maintenance: false
sample_node:
  redis:
    enabled: true

agent_models_maintenance: false
agent_models:
  hostname: models.agrt.dev
agent_delivery_maintenance: false
agent_delivery:
  hostname: delivery.agrt.dev
  # Studio and Forge use Agent Delivery only after Studio has issued its OIDC client and the service is running.
  connected: true
  # App Delivery: argocd-env-projects declares the WorkflowTemplates (app-build, app-deploy, resource-sync, the
  # Agent Delivery defaults) and the per-environment Applications.
  delivery:
    namespace: app-delivery
    domain: apps.rovr.dev
    # The ordered environment profile (agent-platform docs/DELIVERY_V2.md D1), rendered as DELIVERY_ENVIRONMENTS.
    # Keep the names and the primary environment equal to argocd-env-addons app_delivery.environments and
    # app_delivery.primary_environment, or deployments to a missing environment never sync.
    environments:
      - {name: dev, primary: false, approval: none, sandbox: true, requiresPrevious: false}
      - {name: prod, primary: true, approval: owner, sandbox: false, requiresPrevious: true}
    # A GitHub App issues checkout tokens for private app repositories. Set true only after
    # /k8s/<cluster>/agent-delivery/github-app-id and github-app-private-key exist in SSM.
    github_app: false
delivery_pool:
  storage: 10Gi
  storageClass: gp3
# rovr: goal-driven coding agents (opspresso/rovr). SSM parameters live under /k8s/<cluster>/rovr/.
rovr_maintenance: false
rovr:
  hostname: rovr.dev
  github_app_slug: opspresso-rovr
  # Set true after /k8s/<cluster>/rovr/openai-api-key exists; it enables Codex.
  openai: false
  sandbox:
    # Running sandbox Jobs at once, across all accounts. Each takes 2 CPU and 4Gi.
    max_runs: 6
    # Task disks kept between runs (one per open task).
    max_workspaces: 24
    disk: 10Gi
    storage_class: gp3
    # terraform-env-demo 6-eks-node: tainted rovr.dev/sandbox, DefaultDeny network policy.
    node_pool: rovr-sandboxes
