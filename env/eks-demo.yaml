cluster: eks-demo
country: kr
env: eks
metrics:
  backend: prometheus
phase: prod
group: eks-demo
role: mgmt
replicas: 1
autoscaling: true
agent_studio_maintenance: true
agent_memory_maintenance: false
resources: true
trusted_proxy_cidrs:
- 10.10.0.0/16
grafana_url: http://grafana.addon-grafana.svc.cluster.local
aws_account_id: '396608815058'
aws_region: ap-northeast-2
hostname:
  internal: demo-in.rovr.dev
  public: demo.rovr.dev
  this: demo-0.rovr.dev
agent_studio:
  service:
    key: agentops
    name: Agent Studio
    logo: agent-studio
    copyright: © OpsPresso. All rights reserved.
  hostname: studio.agrt.dev
  allowed_hosts:
  - studio.agrt.dev
agent_memory:
  hostname: memory.agrt.dev
  allowed_hosts:
  - memory.agrt.dev
  # Agent Models selection IDs (<provider>/<model>) enabled in this installation.
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    decision: openrouter/jev-1.13
    dream: openrouter/gpt-6-luna
workspace_max_pods: 32
workspace_memory_mb: 2048
workspace_disk_mb: 2048
workspace_cpus: 1
postgresql:
  max_connections: 550
  storage: 20Gi
  storageClass: gp3
agent_librio:
  hostname: librio.agrt.dev
  allowed_hosts:
  - librio.agrt.dev
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    extraction: openrouter/gpt-6-luna
    transcription: openrouter/gpt-4o-transcribe
    summary: openrouter/gpt-6.1-sol
agent_forge:
  hostname: forge.agrt.dev
  allowed_hosts:
  - forge.agrt.dev
agent_librio_maintenance: true
agent_forge_maintenance: false
sample_node:
  redis:
    enabled: true

agent_models_maintenance: false
agent_models:
  hostname: models.agrt.dev
agent_broker_maintenance: true
agent_broker:
  hostname: broker.agrt.dev
  # Studio and Forge use Broker only after Studio has issued Broker's OIDC client and Broker is running.
  connected: true
  # App Delivery: argocd-env-projects declares the WorkflowTemplate and the per-environment Applications.
  delivery:
    namespace: app-delivery
    template: app-delivery
    domain: apps.rovr.dev
broker_pool:
  storage: 10Gi
  storageClass: gp3
