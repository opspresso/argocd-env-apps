cluster: k3s-demo
country: kr
env: k3s
metrics:
  backend: grafana-cloud
phase: alpha
group: k3s-demo
role: k3s
replicas: 1
autoscaling: false
agent_studio_maintenance: false
agent_memory_maintenance: false
resources: false
trusted_proxy_cidrs: []
grafana_url: http://grafana.addon-grafana.svc.cluster.local
aws_account_id: '396608815058'
aws_region: ap-northeast-2
hostname:
  internal: demo-in.rovr.dev
  public: demo.rovr.dev
agent_studio:
  service:
    key: agentops
    name: Agent Studio
    logo: agent-studio
    copyright: © OpsPresso. All rights reserved.
  hostname: studio.agrt.dev
  allowed_hosts:
  - studio.agrt.dev
agent_memory:
  hostname: memory.agrt.dev
  allowed_hosts:
  - memory.agrt.dev
audio_worker: true
workspace_worker: true
workspace_max_pods: 2
workspace_memory_mb: 1024
workspace_disk_mb: 2048
workspace_cpus: 1
workspace_worker_concurrency: 1
postgresql:
  max_connections: 200
  storage: 5Gi
minio:
  storage: 10Gi
agent_librio:
  hostname: librio.agrt.dev
  allowed_hosts:
  - librio.agrt.dev
agent_forge:
  hostname: forge.agrt.dev
  sign_in_domains:
  - nalbam.com
  allowed_hosts:
  - forge.agrt.dev
agent_librio_maintenance: false
agent_forge_maintenance: false
sample_node:
  hostname: sample-node.rovr.dev
  redis:
    enabled: true
    storageClass: local-path
    storage: 1Gi
