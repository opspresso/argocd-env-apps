# Cluster
cluster: k3s-demo
env: k3s
phase: alpha
group: k3s-demo
role: k3s
country: kr

# AWS
aws_account_id: "396608815058"
aws_region: ap-northeast-2

# Network
hostname:
  internal: demo-in.rovr.dev
  public: demo.rovr.dev
trusted_proxy_cidrs: []

# Capacity
replicas: 1
autoscaling: false
resources: false

# Observability
metrics:
  backend: grafana-cloud
grafana_url: http://grafana.addon-grafana.svc.cluster.local

# Maintenance
agent_studio_maintenance: true
agent_memory_maintenance: true
agent_knowledge_maintenance: true
agent_forge_maintenance: true
agent_models_maintenance: true

# Data stores
postgresql:
  max_connections: 250
  storage: 5Gi
minio:
  storage: 10Gi

# Agent Studio
agent_studio:
  service:
    key: agentops
    name: Agent Studio
    logo: agent-studio
    copyright: © OpsPresso. All rights reserved.
  hostname: studio.agrt.dev
  allowed_hosts:
  - studio.agrt.dev
workspace_max_pods: 2
workspace_memory_mb: 1024
workspace_disk_mb: 2048
workspace_cpus: 1

# Agent services
agent_memory:
  hostname: memory.agrt.dev
  allowed_hosts:
  - memory.agrt.dev
  # Agent Models selection IDs (<provider>/<model>) enabled in this installation.
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    decision: openrouter/jev-1.13
    dream: openrouter/gpt-6-luna

agent_knowledge:
  hostname: knowledge.agrt.dev
  allowed_hosts:
  - knowledge.agrt.dev
  models:
    embedding: openrouter/text-embedding-3-small
    reranker: openrouter/rerank-v3.5
    extraction: openrouter/gpt-6-luna
    transcription: openrouter/gpt-4o-transcribe
    summary: openrouter/gpt-6.1-sol

agent_forge:
  hostname: forge.agrt.dev
  allowed_hosts:
  - forge.agrt.dev

agent_models:
  hostname: models.agrt.dev

# Applications
sample_node:
  hostname: sample-node.rovr.dev
  redis:
    enabled: true
    storageClass: local-path
    storage: 1Gi
