# Kubernetes MCP server Agent Studio calls.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. Agent Studio
# reaches it at mcp-kubernetes.agent-mcps.svc.cluster.local.
#
# Deliberately absent, and not an oversight: the HPA, PDB and long
# terminationGracePeriod that agent-studio carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one read-only API
# query, so the chart defaults are right and a copied 660s grace period would
# only make every rollout eleven minutes long.

app:
  fullnameOverride: mcp-kubernetes

  image:
    repository: quay.io/containers/kubernetes_mcp_server

  # No auth, like every MCP server here: nothing routes to this Service from
  # outside, and the NetworkPolicy below admits only Agent Studio.
  #
  # `--read-only` lists only tools that do not change the cluster. RBAC below
  # also grants only get, list and watch, so a write fails even if a future
  # server version lists a mutating tool.
  #
  # `--toolsets core` drops the helm toolset: helm stores releases in Secrets,
  # which the RBAC below deliberately cannot read.
  #
  # `--stateless` returns no Mcp-Session-Id, so any replica can answer any
  # request. It gives up listChanged notifications, which nothing here uses.
  args:
    - "--port"
    - "8080"
    - "--read-only"
    - "--toolsets"
    - "core"
    - "--stateless"

  service:
    name: http
    targetPort: 8080

  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  serviceAccount:
    create: true

  # View-level reads only. Core `secrets` is left out on purpose: an
  # unauthenticated service must not read Secrets. A new API group is invisible
  # to the server until it is added here.
  rbac:
    create: true
    rules:
      - apiGroups: [""]
        resources:
          - pods
          - pods/log
          - pods/status
          - services
          - endpoints
          - namespaces
          - nodes
          - events
          - configmaps
          - persistentvolumeclaims
          - persistentvolumes
          - replicationcontrollers
          - serviceaccounts
          - resourcequotas
          - limitranges
        verbs: ["get", "list", "watch"]
      - apiGroups:
          - apps
          - batch
          - autoscaling
          - policy
          - networking.k8s.io
          - storage.k8s.io
          - rbac.authorization.k8s.io
          - apiextensions.k8s.io
          - metrics.k8s.io
          - coordination.k8s.io
          - discovery.k8s.io
          - events.k8s.io
          - gateway.networking.k8s.io
          - argoproj.io
          - external-secrets.io
        resources: ["*"]
        verbs: ["get", "list", "watch"]

networkPolicy:
  enabled: true

# Only Agent Studio processes that run Agents may call this server. The MCP has
# no authentication, so this ingress rule is its access boundary.
raw:
  resources:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: mcp-kubernetes
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: mcp-kubernetes
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: agent-studio
                podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [agent-studio]
            ports:
              - protocol: TCP
                port: 8080
