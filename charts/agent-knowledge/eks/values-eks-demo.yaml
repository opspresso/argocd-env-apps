app:
  fullnameOverride: agent-knowledge
  jobs:
    schema-check:
      enabled: True
  ecrPullSecret:
    enabled: True
    region: ap-northeast-2
  networkPolicy:
    enabled: True
    appPort:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: addon-prometheus

  replicaCount: 1
  autoscaling:
    enabled: True
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-knowledge

  configmap:
    enabled: true
    data:
      AWS_REGION: ap-northeast-2
      DATABASE_POOL_SIZE: '4'
      DATABASE_QUEUE_POOL_SIZE: '2'
      DATABASE_ADMISSION_POOL_SIZE: '9'
      AUTH_BASE_URL: https://knowledge.agrt.dev
      # The service has no screens of its own; its old pages and every link it emits point here (AgentOps phase 4).
      CONSOLE_BASE_URL: https://agentops.agrt.dev
      # AgentOps Identity signs every token this service accepts (agent-platform docs/OIDC_IDENTITY.md).
      IDENTITY_ISSUER: https://agentops.agrt.dev/identity
      IDENTITY_URL: http://agentops-identity.agentops.svc.cluster.local:3000/identity
      S3_REGION: ap-northeast-2
      S3_BUCKET_NAME: agent-knowledge-static
      S3_FORCE_PATH_STYLE: 'false'
      # Providers, credentials, wire IDs and prices belong to Agent Models.
      # agent_knowledge.models names the selection for each role; a Settings override takes precedence.
      MODELS_URL: http://agent-models.agent-models.svc.cluster.local:3000
      EMBEDDING_MIN_SCORE: '0.2'
      RERANKER_TIMEOUT_MS: '5000'
      RERANKER_MIN_SCORE: '0.05'
      EMBEDDING_MODEL: "openrouter/text-embedding-3-small"
      RERANKER_MODEL: "openrouter/rerank-v3.5"
      EXTRACTION_MODEL: "openrouter/gpt-6-luna"
      VERIFICATION_MODEL: "openrouter/deepseek-v4.1-flash"
      # Processing defaults for the audio models a caller may request; selection is per job.
      AUDIO_PROCESSING_OPTIONS: "[{\"id\": \"openrouter/mai-transcribe-2\", \"kind\": \"transcription\"}, {\"id\": \"openrouter/deepseek-v4.1-flash\", \"kind\": \"summary\"}]"
      DOCUMENT_WORKER_ENABLED: 'false'
      AUDIO_WORKER_ENABLED: 'false'
      KNOWLEDGE_ENRICHMENT_CONCURRENCY: '4'
      # Every replica uses the same PostgreSQL admission policy.
      AI_PROVIDER_MAX_CONCURRENCY: '8'
      AI_BATCH_MAX_CONCURRENCY: '4'
  routing:
    hosts:
    - knowledge.agrt.dev
    httpRoute:
      enabled: true
  # core_tier: the base replicas prefer the on-demand core nodes (terraform-env-demo 51-core-node-pool.tf), one per AZ.
  # HPA growth and rollout surge spill over to Spot instead of waiting for core room.
  tolerations:
    - key: opspresso.com/tier
      operator: Equal
      value: core
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: opspresso.com/tier
                operator: In
                values: [core]
  # Spread the replicas over AZs and nodes so one lost node leaves a replica serving.
  # ScheduleAnyway: a replica still starts when one AZ has no capacity.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-knowledge
      matchLabelKeys: [pod-template-hash]
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-knowledge
      matchLabelKeys: [pod-template-hash]
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://knowledge.agrt.dev
  externalSecrets:
    enabled: true
    data:
    - key: /k8s/eks-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/eks-demo/agent-knowledge/auth-secret
      name: AUTH_SECRET
    # This service's client secret at AgentOps Identity (client knowledge).
    - key: /k8s/eks-demo/agentops-identity/client-secret-knowledge
      name: IDENTITY_CLIENT_SECRET
    - key: /k8s/eks-demo/agent-knowledge/metrics-bearer-token
      name: METRICS_BEARER_TOKEN
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
  workloads:
    worker:
      enabled: true
      replicas: 1
      tolerations:
        - key: opspresso.com/tier
          operator: Equal
          value: core
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: opspresso.com/tier
                    operator: In
                    values: [core]
  raw:
    enabled: true
    resources:
      # The web ServiceMonitor selects this Service by the web name and instance labels, so the worker shares its
      # scrape and credentials. The selector picks only the worker Pods.
      - apiVersion: v1
        kind: Service
        metadata:
          name: agent-knowledge-worker
          labels:
            app: agent-knowledge
            app.kubernetes.io/name: agent-knowledge
            app.kubernetes.io/instance: agent-knowledge-eks-demo
            app.kubernetes.io/component: worker
        spec:
          ports:
            - name: http
              port: 3000
              targetPort: 3000
          selector:
            app.kubernetes.io/name: agent-knowledge-worker
            app.kubernetes.io/instance: agent-knowledge-eks-demo
