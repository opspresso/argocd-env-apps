app:
  fullnameOverride: agent-models
  raw:
    enabled: True

  replicaCount: 1
  autoscaling:
    enabled: True
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-models

  configmap:
    enabled: true
    data:
      # Transactions are short ledger/session writes; upstream calls never hold a connection.
      DATABASE_POOL_SIZE: '8'
      AUTH_BASE_URL: https://models.agrt.dev
      OIDC_ISSUER: https://studio.agrt.dev/api/auth
      OIDC_PROVIDER_ID: studio
      MODELS_REQUEST_TIMEOUT_MS: '600000'
      MODELS_SHUTDOWN_GRACE_MS: '600000'
      MODELS_MAX_CONCURRENT_REQUESTS: '64'
      MODELS_MAX_REQUEST_BYTES: '100663296'
      MODELS_MAX_STREAM_BUFFER_BYTES: '268435456'
      AWS_REGION: ap-northeast-2
  externalSecrets:
    enabled: true
    data:
    - key: /k8s/eks-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/eks-demo/agent-models/auth-secret
      name: AUTH_SECRET
    - key: /k8s/eks-demo/agent-models/aes-encryption-key
      name: AES_ENCRYPTION_KEY
    - key: /k8s/eks-demo/agent-models/oidc-client-id
      name: OIDC_CLIENT_ID
    - key: /k8s/eks-demo/agent-models/oidc-client-secret
      name: OIDC_CLIENT_SECRET
  routing:
    hosts:
    - models.agrt.dev
    httpRoute:
      enabled: true
  # core_tier: the base replicas prefer the on-demand core nodes (terraform-env-demo 51-core-node-pool.tf), one per AZ.
  # HPA growth and rollout surge spill over to Spot instead of waiting for core room.
  tolerations:
    - key: opspresso.com/tier
      operator: Equal
      value: core
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: opspresso.com/tier
                operator: In
                values: [core]
  # Spread the replicas over AZs and nodes so one lost node leaves a replica serving.
  # ScheduleAnyway: a replica still starts when one AZ has no capacity.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-models
      matchLabelKeys: [pod-template-hash]
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-models
      matchLabelKeys: [pod-template-hash]
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://models.agrt.dev
  ingressPeers:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: istio-system
  registry:
    region: ap-northeast-2
