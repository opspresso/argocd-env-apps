app:
  fullnameOverride: agent-studio

  replicaCount: 1
  autoscaling:
    enabled: True
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio

  configmap:
    enabled: true
    data:
      STAGE: 'prod'
      DATABASE_POOL_SIZE: '4'
      SERVICE_NAME: 'Agent Studio'
      AWS_REGION: ap-northeast-2
      # AgentOps Identity signs every token Studio accepts and holds people, teams and Git connections
      # (agent-platform docs/OIDC_IDENTITY.md). Sign-in, admins and Git hosts are Identity settings (charts/agentops).
      IDENTITY_ISSUER: https://agentops.agrt.dev/identity
      IDENTITY_URL: http://agentops-identity.agentops.svc.cluster.local:3000/identity
      # Studio's public origin: the Agent API base, webhook addresses and MCP OAuth client metadata.
      PUBLIC_BASE_URL: https://studio.agrt.dev
      S3_BUCKET_NAME: agent-studio-static
      ARTIFACT_ACCESS_MODE: proxied
      CATALOG_ENABLED: 'true'
      SLACK_LOADING_INDICATOR: ':loading:'
      EMBEDDING_DIM: native
      CATALOG_MIN_SCORE: '0.2'
      RERANKER_MIN_SCORE: '0.05'
      UNKNOWN_MODEL_POLICY: allow
      # Agent Models owns provider connections, credentials, selections and usage.
      MODELS_URL: http://agent-models.agent-models.svc.cluster.local:3000
      MODELS_PUBLIC_URL: https://models.agrt.dev
      MODEL_USAGE_DEFAULTS: "{\"decisionModel\": \"openrouter/jev-1.14\", \"defaultModel\": \"openrouter/deepseek-v4.1-flash\", \"embeddingModel\": \"openrouter/text-embedding-3-small\", \"modelRouting\": {\"localOnly\": false, \"maxCallCostUsd\": 0, \"maxCalls\": 0, \"maxRunCostUsd\": 0, \"minOutputChars\": 1, \"policies\": {}, \"tiers\": {\"coding\": \"openrouter/deepseek-v4.1-flash\", \"fast\": \"openrouter/gpt-6-luna\", \"general\": \"openrouter/deepseek-v4.1-flash\", \"reasoning\": \"openrouter/glm-5.3\", \"vision\": \"openrouter/deepseek-v4.1-flash\"}}, \"rerankerModel\": \"openrouter/rerank-v3.5\"}"
      # The AgentOps console that serves Studio's screens; production Studio refuses to boot without it.
      CONSOLE_BASE_URL: https://agentops.agrt.dev
      MAX_RUN_DURATION_MS: '600000'
      MAX_CONCURRENT_RUNS_PER_ACTOR: '0'
      MEMBER_TIER_DEFAULTS: "[{\"id\": \"admin\", \"monthlyCostCapUsd\": null}, {\"id\": \"super\", \"monthlyCostCapUsd\": 50}, {\"id\": \"member\", \"monthlyCostCapUsd\": 5}, {\"id\": \"guest\", \"monthlyCostCapUsd\": 0}]"
      CAPABILITY_VISIBILITY_DEFAULTS: "{\"plugins\": [], \"skills\": [], \"tools\": [\"gmail\", \"google-calendar\", \"google-docs\", \"google-drive\", \"google-sheets\", \"google-slides\", \"slack\"]}"
      MCP_INTERNAL_HOST_SUFFIXES: agent-mcps.svc.cluster.local,agent-memory.svc.cluster.local,agent-knowledge.svc.cluster.local,agent-forge.svc.cluster.local,agent-runway.svc.cluster.local
      FORGE_URL: http://agent-forge.agent-forge.svc.cluster.local:3000
      MEMORY_URL: http://agent-memory.agent-memory.svc.cluster.local:3000
      KNOWLEDGE_URL: http://agent-knowledge.agent-knowledge.svc.cluster.local:3000
      RUNWAY_URL: http://agent-runway.agent-runway.svc.cluster.local:3000
      PLUGINS_REPO: opspresso/agent-plugins
      PLUGINS_REPO_BRANCH: main
      # PR review reaches GitHub with the caller's GitHub MCP grant.
      GITHUB_API_URL: https://api.github.com
      GITHUB_WEB_URL: https://github.com
  routing:
    hosts:
    - studio.agrt.dev
    httpRoute:
      enabled: true
  # core_tier: the base replicas prefer the on-demand core nodes (terraform-env-demo 51-core-node-pool.tf), one per AZ.
  # HPA growth and rollout surge spill over to Spot instead of waiting for core room.
  tolerations:
    - key: opspresso.com/tier
      operator: Equal
      value: core
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: opspresso.com/tier
                operator: In
                values: [core]
  # Spread the replicas over AZs and nodes so one lost node leaves a replica serving.
  # ScheduleAnyway: a replica still starts when one AZ has no capacity.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-studio
      matchLabelKeys: [pod-template-hash]
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-studio
      matchLabelKeys: [pod-template-hash]
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://studio.agrt.dev

  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo

  externalSecrets:
    enabled: true
    data:
    # Studio's client secret at AgentOps Identity (client studio).
    - key: /k8s/eks-demo/agentops-identity/client-secret-studio
      name: IDENTITY_CLIENT_SECRET
    - key: /k8s/eks-demo/agent-studio/aes-encryption-key
      name: AES_ENCRYPTION_KEY
    - key: /k8s/eks-demo/agent-studio/plugins-repo-token
      name: PLUGINS_REPO_TOKEN
    - key: /k8s/eks-demo/agent-studio/schedule-scan-token
      name: SCHEDULE_SCAN_TOKEN
    - key: /k8s/eks-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/eks-demo/agent-studio/metrics-bearer-token
      name: METRICS_BEARER_TOKEN
  networkPolicy:
    appPort:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: addon-prometheus
  ecrPullSecret:
    region: ap-northeast-2
  workloads:
    scheduleTicker:
      enabled: true
      replicas: 1
      tolerations:
        - key: opspresso.com/tier
          operator: Equal
          value: core
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: opspresso.com/tier
                    operator: In
                    values: [core]