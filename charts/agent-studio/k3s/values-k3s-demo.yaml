app:
  fullnameOverride: agent-studio


  replicaCount: 0
  autoscaling:
    enabled: False
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio

  imagePullSecrets:
    - name: ecr-registry


  resources: null

  configmap:
    enabled: true
    data:
      STAGE: 'alpha'
      DATABASE_POOL_SIZE: '4'
      SERVICE_NAME: 'Agent Studio'
      SERVICE_LOGO: 'agent-studio'

      SERVICE_COPYRIGHT: "\u00a9 OpsPresso. All rights reserved."

      ADMIN_EMAILS: me@nalbam.com
      # ALLOWED_EMAIL_DOMAINS: nalbam.com
      AWS_REGION: ap-northeast-2
      AUTH_BASE_URL: https://studio.agrt.dev

      AUTH_ALLOWED_HOSTS: 'studio.agrt.dev'
      # PUBLIC_BASE_URL: https://studio.agrt.dev
      S3_BUCKET_NAME: agent-studio-static

      S3_ENDPOINT: http://minio.agent-studio.svc.cluster.local:9000

      ARTIFACT_ACCESS_MODE: proxied
      CATALOG_ENABLED: 'true'
      SLACK_LOADING_INDICATOR: ':loading:'
      TRUSTED_PROXY_CIDRS: ''
      EMBEDDING_DIM: native
      CATALOG_MIN_SCORE: '0.2'

      RERANKER_MIN_SCORE: '0.01'

      UNKNOWN_MODEL_POLICY: allow
      LLM_PROVIDER_ANTHROPIC_BASE_URL: https://api.anthropic.com/v1
      LLM_PROVIDER_OPENAI_BASE_URL: https://api.openai.com/v1
      LLM_PROVIDER_GOOGLE_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      LLM_PROVIDER_XAI_BASE_URL: https://api.x.ai/v1
      LLM_PROVIDER_OPENROUTER_BASE_URL: https://openrouter.ai/api/v1

      LLM_PROVIDER_SELFHOSTED_BASE_URL: https://llm.nyala-blenny.ts.net/v1

      MAX_RUN_DURATION_MS: '600000'
      MAX_CONCURRENT_RUNS_PER_ACTOR: '60'
      MCP_INTERNAL_HOST_SUFFIXES: agent-mcps.svc.cluster.local,agent-memory.svc.cluster.local,agent-librio.svc.cluster.local,agent-forge.svc.cluster.local
      FORGE_URL: http://agent-forge.agent-forge.svc.cluster.local:3103
      FORGE_DELEGATION_ISSUER: https://studio.agrt.dev
      WORKSPACE_OBSERVER_CONCURRENCY: '1'
      WORKSPACE_CONTINUATION_CONCURRENCY: '2'
      MEMORY_URL: http://agent-memory.agent-memory.svc.cluster.local:3000
      MEMORY_DELEGATION_ISSUER: https://studio.agrt.dev
      LIBRIO_URL: http://agent-librio.agent-librio.svc.cluster.local:3000
      LIBRIO_DELEGATION_ISSUER: https://studio.agrt.dev
      PLUGINS_REPO: opspresso/agent-plugins
      PLUGINS_REPO_BRANCH: main

      GITHUB_API_URL: https://api.github.com
      GITHUB_WEB_URL: https://github.com

  routing:
    hosts:
    - studio.agrt.dev
    httpRoute:
      enabled: true

      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway


  podAnnotations:
    link.argocd.argoproj.io/external-link: https://studio.agrt.dev

  serviceMonitor:
    enabled: false
    labels:
      release: prometheus-k3s-demo

  externalSecrets:
    enabled: true
    data:
    - key: /k8s/common/agentops/better-auth-secret
      name: AUTH_SECRET

    - key: /k8s/common/agentops/google-client-id
      name: GOOGLE_CLIENT_ID
    - key: /k8s/common/agentops/google-client-secret
      name: GOOGLE_CLIENT_SECRET


    - key: /k8s/common/agent-studio/llm-provider-openai-api-key
      name: LLM_PROVIDER_OPENAI_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-anthropic-api-key
      name: LLM_PROVIDER_ANTHROPIC_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-google-api-key
      name: LLM_PROVIDER_GOOGLE_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-xai-api-key
      name: LLM_PROVIDER_XAI_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-openrouter-api-key
      name: LLM_PROVIDER_OPENROUTER_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-selfhosted-api-key
      name: LLM_PROVIDER_SELFHOSTED_API_KEY
    - key: /k8s/common/agent-studio/aes-encryption-key
      name: AES_ENCRYPTION_KEY
    - key: /k8s/common/agent-studio/github-token
      name: PLUGINS_REPO_TOKEN
    - key: /k8s/common/agent-studio/schedule-scan-token
      name: SCHEDULE_SCAN_TOKEN
    - key: /k8s/k3s-demo/agent-platform/database-url
      name: DATABASE_URL

    - key: /k8s/k3s-demo/agent-studio/minio-root-user
      name: S3_ACCESS_KEY_ID
    - key: /k8s/k3s-demo/agent-studio/minio-root-password
      name: S3_SECRET_ACCESS_KEY

    - key: /k8s/k3s-demo/agent-studio/metrics-bearer-token
      name: METRICS_BEARER_TOKEN
    - key: /k8s/k3s-demo/agent-forge/organization-id
      name: FORGE_ORGANIZATION_ID
    - key: /k8s/k3s-demo/agent-forge/delegation-secret
      name: FORGE_DELEGATION_SECRET
    - key: /k8s/k3s-demo/agent-forge/policy-secret
      name: FORGE_POLICY_SECRET
    - key: /k8s/k3s-demo/agent-memory/delegation-secret
      name: MEMORY_DELEGATION_SECRET
    - key: /k8s/k3s-demo/agent-librio/delegation-secret
      name: LIBRIO_DELEGATION_SECRET
    - key: /k8s/k3s-demo/agent-librio/policy-secret
      name: LIBRIO_POLICY_SECRET
  ingressPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system

      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system

    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: addon-alloy
  registry:
    region: ap-northeast-2
  workloads:
    scheduleTicker:
      enabled: true
      replicas: 0


    audioWorker:
      enabled: true
      replicas: 0


    workspaceWorker:
      enabled: true
      replicas: 0