app:
  fullnameOverride: agent-studio


  replicaCount: 1
  autoscaling:
    enabled: False
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio

  imagePullSecrets:
    - name: ecr-registry


  resources: null

  configmap:
    enabled: true
    data:
      STAGE: 'alpha'
      DATABASE_POOL_SIZE: '4'
      SERVICE_NAME: 'Agent Studio'
      SERVICE_LOGO: 'agent-studio'

      SERVICE_COPYRIGHT: "\u00a9 OpsPresso. All rights reserved."

      ADMIN_EMAILS: me@nalbam.com
      # ALLOWED_EMAIL_DOMAINS: nalbam.com
      AWS_REGION: ap-northeast-2
      AUTH_BASE_URL: https://studio.agrt.dev

      AUTH_ALLOWED_HOSTS: 'studio.agrt.dev'
      # PUBLIC_BASE_URL: https://studio.agrt.dev
      S3_BUCKET_NAME: agent-studio-static

      S3_ENDPOINT: http://minio.agent-studio.svc.cluster.local:9000

      ARTIFACT_ACCESS_MODE: proxied
      CATALOG_ENABLED: 'true'
      SLACK_LOADING_INDICATOR: ':loading:'
      TRUSTED_PROXY_CIDRS: ''
      EMBEDDING_DIM: native
      CATALOG_MIN_SCORE: '0.2'

      RERANKER_MIN_SCORE: '0.01'

      UNKNOWN_MODEL_POLICY: allow
      # Agent Models owns provider connections, credentials, selections and usage.
      MODELS_URL: http://agent-models.agent-models.svc.cluster.local:3400
      MODELS_PUBLIC_URL: https://models.agrt.dev
      MAX_RUN_DURATION_MS: '600000'
      MAX_CONCURRENT_RUNS_PER_ACTOR: '60'
      MCP_INTERNAL_HOST_SUFFIXES: agent-mcps.svc.cluster.local,agent-memory.svc.cluster.local,agent-librio.svc.cluster.local,agent-forge.svc.cluster.local
      FORGE_URL: http://agent-forge.agent-forge.svc.cluster.local:3103
      MEMORY_URL: http://agent-memory.agent-memory.svc.cluster.local:3000
      LIBRIO_URL: http://agent-librio.agent-librio.svc.cluster.local:3000
      PLUGINS_REPO: opspresso/agent-plugins
      PLUGINS_REPO_BRANCH: main
      # PR review reaches GitHub with the caller's GitHub MCP grant.
      GITHUB_API_URL: https://api.github.com
      GITHUB_WEB_URL: https://github.com
  routing:
    hosts:
    - studio.agrt.dev
    httpRoute:
      enabled: true

      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway


  podAnnotations:
    link.argocd.argoproj.io/external-link: https://studio.agrt.dev

  serviceMonitor:
    enabled: false
    labels:
      release: prometheus-k3s-demo

  externalSecrets:
    enabled: true
    data:
    - key: /k8s/common/agentops/better-auth-secret
      name: AUTH_SECRET

    - key: /k8s/common/agentops/google-client-id
      name: GOOGLE_CLIENT_ID
    - key: /k8s/common/agentops/google-client-secret
      name: GOOGLE_CLIENT_SECRET


    - key: /k8s/common/agent-studio/aes-encryption-key
      name: AES_ENCRYPTION_KEY
    - key: /k8s/common/agent-studio/github-token
      name: PLUGINS_REPO_TOKEN
    - key: /k8s/common/agent-studio/schedule-scan-token
      name: SCHEDULE_SCAN_TOKEN
    - key: /k8s/k3s-demo/agent-platform/database-url
      name: DATABASE_URL

    - key: /k8s/k3s-demo/agent-studio/minio-root-user
      name: S3_ACCESS_KEY_ID
    - key: /k8s/k3s-demo/agent-studio/minio-root-password
      name: S3_SECRET_ACCESS_KEY

    - key: /k8s/k3s-demo/agent-studio/metrics-bearer-token
      name: METRICS_BEARER_TOKEN
    - key: /k8s/k3s-demo/agent-forge/organization-id
      name: FORGE_ORGANIZATION_ID
    # Studio registers each service client; the service and Studio read the same client ID.

    - key: /k8s/k3s-demo/agent-forge/oidc-client-id
      name: FORGE_OIDC_CLIENT_ID

    - key: /k8s/k3s-demo/agent-memory/oidc-client-id
      name: MEMORY_OIDC_CLIENT_ID

    - key: /k8s/k3s-demo/agent-librio/oidc-client-id
      name: LIBRIO_OIDC_CLIENT_ID

  ingressPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system

      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system

    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: addon-alloy
  registry:
    region: ap-northeast-2
  workloads:
    scheduleTicker:
      enabled: true
      replicas: 1