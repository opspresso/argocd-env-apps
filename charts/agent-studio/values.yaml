app:
  fullnameOverride: agent-studio
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio
    tag: latest
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  service:
    name: http
    port: 3000
    targetPort: 3000
  controller:
    strategy:
      rollingUpdate:
        maxSurge: 100%
        maxUnavailable: 0
  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 36
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/ready
      port: 3000
    timeoutSeconds: 5
    periodSeconds: 5
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
  terminationGracePeriodSeconds: 660
  lifecycle:
    preStop:
      exec:
        command:
        - /bin/sh
        - -c
        - sleep 15
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    metrics:
    - type: Pods
      pods:
        metric:
          name: agent_studio_active_execution_requests
        target:
          type: AverageValue
          averageValue: '8'
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  serviceMonitor:
    enabled: true
    endpoints:
    - interval: 15s
      path: /api/metrics
      port: http
      authorization:
        type: Bearer
        credentials:
          name: agent-studio-external
          key: METRICS_BEARER_TOKEN
  routing:
    httpRoute:
      parentRefs:
      - name: istio-ingressgateway
        namespace: istio-system
  serviceAccount:
    create: true
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store
  workloads:
    scheduleTicker:
      enabled: false
      fullnameOverride: agent-studio-ticker
      containerName: ticker
      controller:
        strategy:
          type: Recreate
      service:
        enabled: false
      image:
        repository: curlimages/curl
        tag: 8.11.1
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
      podAnnotations:
        sidecar.istio.io/inject: 'false'
      terminationGracePeriodSeconds: 60
      command:
      - /bin/sh
      - -c
      - |
        #!/bin/sh

        set -u

        APP="${TICK_TARGET:-http://agent-studio:3000}"

        if [ -z "${SCHEDULE_SCAN_TOKEN:-}" ]; then
          echo "SCHEDULE_SCAN_TOKEN is required" >&2
          exit 1
        fi

        post() {
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 -m 15 -X POST \
            -H "X-Scan-Token: $SCHEDULE_SCAN_TOKEN" "$APP$1")
          status=$?
          case "$code" in
            2*) [ "$status" -eq 0 ] && return 0 ;;
          esac
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $1 -> HTTP $code (curl exit $status)" >&2
          return 1
        }

        trap 'exit 0' INT TERM
        next_reindex=0
        while true; do
          started=$(date +%s)
          # Each endpoint has its own result; a failed scan must not suppress plugin sync.
          failures=0
          post /api/triggers/scan || failures=$((failures + 1))
          post /api/plugins/sync/scan || failures=$((failures + 1))
          if [ "$started" -ge "$next_reindex" ]; then
            post /api/catalog/reindex || failures=$((failures + 1))
            next_reindex=$((started + 3600))
          fi
          [ "$failures" -eq 0 ] || echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ticker failed endpoints: $failures" >&2
          # Include request time in the minute. Do not replay ticks missed while stopped.
          delay=$((60 - ($(date +%s) - started)))
          [ "$delay" -gt 0 ] || delay=1
          sleep "$delay" &
          wait "$!"
        done
      env:
      - name: SCHEDULE_SCAN_TOKEN
        valueFrom:
          secretKeyRef:
            name: agent-studio-external
            key: SCHEDULE_SCAN_TOKEN
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      overrides: |
        enabled: {{ .Values.workloads.scheduleTicker.enabled }}
        replicaCount: {{ .Values.workloads.scheduleTicker.replicas | default 0 }}
        {{- if not .Values.resources }}
        resources: null
        {{- end }}
  raw:
    enabled: true
    parentTemplates:
    - |
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: ECRAuthorizationToken
      metadata:
        name: agent-studio-workspace-ecr
        namespace: {{ include "app.namespace" . }}
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
      spec:
        region: {{ .Values.registry.region }}
      ---
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ecr-registry
        namespace: {{ include "app.namespace" . }}
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
      spec:
        refreshInterval: 1h
        target:
          name: ecr-registry
          template:
            type: kubernetes.io/dockerconfigjson
            data:
              .dockerconfigjson: |
                {"auths":{"{{`{{ .proxy_endpoint }}`}}":{"username":"{{`{{ .username }}`}}","password":"{{`{{ .password }}`}}","auth":"{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"}}}
        dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ECRAuthorizationToken
                name: agent-studio-workspace-ecr
    - |
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: {{ include "app.fullname" . }}
        namespace: {{ include "app.namespace" . }}
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: {{ .Release.Name }}
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector: {}
      {{- with .Values.ingressPeers }}
      {{ toYaml . | indent 8 }}
      {{- end }}
      {{- range .Values.servicePeers }}
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: {{ . | quote }}
      {{- end }}
            ports:
              - protocol: TCP
                port: {{ .Values.service.targetPort }}
  automountServiceAccountToken: false
  registry:
    region: ap-northeast-2
  ingressPeers:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: istio-system
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: addon-prometheus
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: addon-alloy
  servicePeers:
  - agent-studio
  - agent-forge
  - agent-librio
