app:
  replicaCount: 1
  autoscaling:
    enabled: True

  configmap:
    data:
      CLUSTER_NAME: 'eks-demo-a'
      MESSAGE: hello world
      PROFILE: 'eks'
  routing:
    hosts:
    - sample-grpc.demo.rovr.dev
    httpRoute:
      enabled: true


  podLabels:
    sidecar.istio.io/inject: "true"

  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-grpc.demo.rovr.dev
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo-a