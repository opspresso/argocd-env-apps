# Argo CD MCP server Agent Studio calls.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. The parent
# chart's NetworkPolicy further admits only Agent Studio and this chart's test
# pod. Agent Studio reaches it at mcp-argocd.agent-mcps.svc.cluster.local.
#
# Deliberately absent, and not an oversight: the HPA, PDB and long
# terminationGracePeriod that agent-studio carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one Argo CD API call, so
# the chart defaults are right and a copied 660s grace period would only make
# every rollout eleven minutes long.

app:
  fullnameOverride: mcp-argocd

  # quay.io, like mcp-kubernetes. Upstream publishes to quay.io and ghcr.io —
  # the bare `argoprojlabs/mcp-for-argocd` in its README is the quay path, and
  # there is no Docker Hub repository behind that name.
  image:
    repository: quay.io/argoprojlabs/mcp-for-argocd

  # `--stateless` is what lets this chart skip mcp-grafana's destinationRule.
  # The default keeps streamable-http sessions in the pod's memory, pinning
  # every request of a session to the pod that created it; stateless returns no
  # Mcp-Session-Id at all, so any replica can answer any request and raising
  # replicas is a non-event.
  #
  # The image declares `node dist/index.js` as its ENTRYPOINT, so the args begin
  # with the transport. `--port 3000` restates the command's default so the
  # Service targetPort and probes below have something to agree with. The port
  # is a flag, not an env var, whatever upstream's `make run PORT=` implies.
  #
  # The server binds loopback by default and refuses a wider bind until its
  # security mode is explicit. This chart has no route or ingress and
  # exposes only a ClusterIP, so unauthenticated access remains inside the
  # cluster boundary; ARGOCD_API_TOKEN below still authenticates outbound calls.
  args:
    - "http"
    - "--port"
    - "3000"
    - "--stateless"
    - "--bind-address"
    - "0.0.0.0"
    - "--allow-unauthenticated"
    - "--allowed-host-header"
    - "mcp-argocd.agent-mcps.svc.cluster.local"
    - "--allowed-host-header"
    - "mcp-argocd"

  service:
    name: http
    targetPort: 3000

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  readinessProbe:
    httpGet:
      path: /healthz
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /healthz
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  serviceAccount:
    create: true

networkPolicy:
  enabled: true

raw:
  resources:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: mcp-argocd
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: mcp-argocd
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: agent-studio
                podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [agent-studio]
            ports:
              - protocol: TCP
                port: 3000
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: mcp-argocd
            ports:
              - protocol: TCP
                port: 3000
