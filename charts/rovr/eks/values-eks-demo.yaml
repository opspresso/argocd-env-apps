app:
  fullnameOverride: rovr
  raw:
    enabled: True


  replicaCount: 2
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/rovr

  ssmPrefix: /k8s/eks-demo
  registry:
    region: ap-northeast-2
  configmap:
    enabled: true
    data:
      ROVR_PUBLIC_URL: https://rovr.dev
      GITHUB_APP_SLUG: "opspresso-rovr"

      # Only these GitHub logins may sign in.
      ROVR_ALLOWED_LOGINS: "nalbam"


      # Only these GitHub logins may change anything and use the Helper.
      ROVR_OPERATOR_LOGINS: "nalbam"


      # Its owner's admins see and update the coding tool versions in Settings.
      ROVR_TOOLS_REPO: "opspresso/rovr"

  sandbox:
    maxRuns: 6
    maxWorkspaces: 24
    disk: "10Gi"
    storageClass: "gp3-ephemeral"
    nodePool: "rovr-sandboxes"
    dnsCidrs:
      - 172.20.0.10/32
    allowPublic: True

    cache:
      fileSystemId: "fs-0eb3767a177294715"
      accessPointId: "fsap-02ca3faf77d338014"
      size: "50Gi"

  routing:
    hosts:
    - rovr.dev
    httpRoute:
      enabled: true


  podLabels:
    sidecar.istio.io/inject: "true"

  podAnnotations:
    link.argocd.argoproj.io/external-link: https://rovr.dev
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
  externalSecrets:
    enabled: true
    data:
    - key: /k8s/eks-demo/rovr/database-url
      name: DATABASE_URL
    - key: /k8s/eks-demo/rovr/session-secret
      name: ROVR_SESSION_SECRET
    - key: /k8s/eks-demo/rovr/run-token-secret
      name: ROVR_RUN_TOKEN_SECRET
    - key: /k8s/eks-demo/rovr/secret-key
      name: ROVR_SECRET_KEY
    - key: /k8s/eks-demo/rovr/metrics-bearer-token
      name: METRICS_BEARER_TOKEN
    # One GitHub App for sign-in, repository access and webhooks; see rovr docs/github-app.md.
    - key: /k8s/eks-demo/rovr/github-app-id
      name: GITHUB_APP_ID
    - key: /k8s/eks-demo/rovr/github-app-private-key
      name: GITHUB_APP_PRIVATE_KEY
    - key: /k8s/eks-demo/rovr/github-client-id
      name: GITHUB_APP_CLIENT_ID
    - key: /k8s/eks-demo/rovr/github-client-secret
      name: GITHUB_APP_CLIENT_SECRET
    - key: /k8s/eks-demo/rovr/github-webhook-secret
      name: GITHUB_WEBHOOK_SECRET
