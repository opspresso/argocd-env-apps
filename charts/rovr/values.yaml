app:
  fullnameOverride: rovr
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/rovr
    tag: latest
  # Two replicas serve the web app and API; one of them leads the orchestrator
  # (PostgreSQL advisory lock), so the count is fixed and there is no HPA.
  replicaCount: 2
  # Working set p99 18Mi, 10-day peak 53Mi (7 days to 2026-11-13).
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 512Mi
  # 8080 is the public listener (web app, API, sign-in, webhooks). 8081 is the
  # internal listener for sandbox callbacks and the model proxy; the HTTPRoute
  # targets only 8080 and networkPolicy admits only sandboxes to 8081.
  service:
    name: http
    port: 8080
    targetPort: 8080
    extraPorts:
    - name: internal
      port: 8081
      targetPort: internal
      protocol: TCP
  extraPorts:
  - name: internal
    containerPort: 8081
    protocol: TCP
  controller:
    strategy:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  startupProbe:
    httpGet:
      path: /healthz
      port: 8080
    periodSeconds: 2
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  # The image has no shell; rovr-server itself turns unready and waits a few
  # seconds on SIGTERM before it stops accepting connections. It then keeps
  # serving the model streams sandboxes already opened for up to 15 minutes
  # (modelDrain in cmd/rovr-server), so a deploy does not cut agents' work.
  terminationGracePeriodSeconds: 930
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  serviceAccount:
    create: true
  # The server creates sandbox Jobs through the Kubernetes API.
  automountServiceAccountToken: true
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  routing:
    httpRoute:
      parentRefs:
      - name: istio-ingressgateway
        namespace: istio-system
  serviceMonitor:
    enabled: false
    endpoints:
    - interval: 30s
      path: /metrics
      port: http
      authorization:
        type: Bearer
        credentials:
          name: rovr-external
          key: METRICS_BEARER_TOKEN
  externalSecrets:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store
  configmap:
    enabled: true
    tpl: true
    data:
      # The pool size is declared because the shared database budget counts it.
      # Other settings keep rovr's defaults; see rovr docs/configuration.md.
      # Run limits are in rovr's Settings.
      ROVR_DATABASE_MAX_CONNS: "10"
      # One version source: the server image tag. The sandbox image is built and released with it as sandbox-<tag>.
      # The other ROVR_SANDBOX_* settings are cluster values in values-template.yaml.j2.
      ROVR_SANDBOX_IMAGE: '{{ printf "%s:sandbox-%s" .Values.image.repository .Values.image.tag }}'
  # Sandbox Pods pull the sandbox image with this Secret; rovr itself does not use it.
  ecrPullSecret:
    enabled: true
    region: ap-northeast-2
    generatorName: rovr-sandbox-ecr
    releaseNamespace: false
    namespaces: [rovr-sandboxes]
  networkPolicy:
    enabled: true
    appPort:
      sameNamespace: true
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: istio-system
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: addon-prometheus
    ingress:
      # Only sandboxes reach the internal listener: run callbacks and the model proxy.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: rovr-sandboxes
            podSelector:
              matchLabels:
                app.kubernetes.io/name: rovr-sandbox
        ports:
          - protocol: TCP
            port: 8081
      # Prometheus scrapes the Istio sidecar's Envoy stats on 15090 (PodMonitor istio-system/istio-sidecars).
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: addon-prometheus
        ports:
          - protocol: TCP
            port: 15090
  # rovr's own database and role on the shared PostgreSQL (Service postgres in namespace agent-studio). The Job runs in
  # the PostgreSQL namespace, so the administrator password never leaves it. values-template.yaml.j2 renders the
  # ExternalSecret rovr-postgresql that holds the rovr password.
  jobs:
    db-bootstrap:
      enabled: false
      namespace: agent-studio
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
        argocd.argoproj.io/sync-wave: "-1"
      backoffLimit: 12
      ttlSecondsAfterFinished: 3600
      podLabels:
        sidecar.istio.io/inject: "false"
      restartPolicy: OnFailure
      image: pgvector/pgvector:0.8.6-pg18-trixie
      imagePullSecrets: []
      containerName: bootstrap
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: postgres-password
        - name: ROVR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rovr-postgresql
              key: password
      command:
        - sh
        - -ec
        - |
          until pg_isready -h postgres -U agent_studio -d postgres; do sleep 2; done
          psql -h postgres -U agent_studio -d postgres -v ON_ERROR_STOP=1 -v pw="$ROVR_PASSWORD" <<'SQL'
          SELECT 'CREATE ROLE rovr LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'rovr')\gexec
          ALTER ROLE rovr WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'pw';
          SELECT 'CREATE DATABASE rovr OWNER rovr' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'rovr')\gexec
          REVOKE ALL ON DATABASE rovr FROM PUBLIC;
          GRANT CONNECT, TEMPORARY ON DATABASE rovr TO rovr;
          SQL
