app:
  fullnameOverride: sample-node

  image:
    # repository: 082867736673.dkr.ecr.ap-northeast-2.amazonaws.com/nalbam/sample-node
    repository: nalbam/sample-node

  # controller:
  #   kind: Rollout
  #   strategy:
  #     type: Canary
  #     # rollingUpdate:
  #     #   maxSurge: 25%
  #     #   maxUnavailable: 0
  #     canary:
  #       canaryService: sample-node-preview
  #       stableService: sample-node
  #       trafficRouting:
  #         istio:
  #           virtualService:
  #             name: sample-node
  #             routes:
  #             - primary
  #           destinationRule:
  #             name: sample-node
  #             canarySubsetName: canary
  #             stableSubsetName: stable
  #       steps:
  #       - setWeight: 10
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 25
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 50
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    enabled: true

    minReplicas: 1
    maxReplicas: 6

    behavior:
      scaleDown:
        policies:
        - periodSeconds: 60
          type: Percent
          value: 25
        stabilizationWindowSeconds: 600
    # The pod runs an injected istio-proxy beside the app, and a type: Resource
    # target sums both containers' CPU and divides by both their requests — the
    # sidecar's idle usage drags the ratio down and hides load on the app.
    # ContainerResource scopes the signal to the app container alone; `app` is
    # the container name the upstream chart's deployment uses.
    #
    # The target stays at 50, but it now means 50m of the app's own 100m request
    # rather than 50% of the pod's combined request, so it scales out earlier.
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 50

  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /read
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /live
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  service:
    name: http
    targetPort: 3000

  routing:
    httpRoute:
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node

  pdb:
    enabled: true
    maxUnavailable: 1

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store


redis:
  enabled: true
  fullnameOverride: redis

  # bitnamilegacy keeps the chart 22.0.7 default tags; every image below is published for
  # linux/amd64 and linux/arm64. The chart rejects non-default repositories without allowInsecureImages.
  image:
    repository: bitnamilegacy/redis
  metrics:
    image:
      repository: bitnamilegacy/redis-exporter
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  kubectl:
    image:
      repository: bitnamilegacy/kubectl
  sysctl:
    image:
      repository: bitnamilegacy/os-shell

  global:
    storageClass: gp3 # aws-ebs-sc
    security:
      allowInsecureImages: true

  # master:
  #   persistence:
  #     existingClaim: sample-redis-master-0
  #     # size: 9Gi

  auth:
    existingSecret: sample-node-external
    existingSecretPasswordKey: REDIS_PASS

  architecture: standalone

  master:
    resourcesPreset: none
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi


raw:
  enabled: false

  resources:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          app.kubernetes.io/component: master
          app.kubernetes.io/instance: sample-node-eks-demo
          app.kubernetes.io/name: redis
        name: sample-redis-master-0
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: gp3 # aws-ebs-sc
        volumeMode: Filesystem
        volumeName: pvc-5d0eeea7-3f8f-406e-ab7d-c114a7bcc81a
