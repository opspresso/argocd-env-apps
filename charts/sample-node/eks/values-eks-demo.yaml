app:
  replicaCount: 1
  autoscaling:
    enabled: True

  configmap:
    data:
      CLUSTER_NAME: 'eks-demo'
      HOSTNAME: sample.svc.cluster.local
      MESSAGE: hello world
      PROFILE: 'eks'
      PROTOCOL: http
      REDIS_ENABLED: 'true'

      REDIS_HOST: redis-master
      REDIS_PORT: '6379'

  routing:
    hosts:
    - sample-node.demo.rovr.dev
    httpRoute:
      enabled: true


  podLabels:
    sidecar.istio.io/inject: "true"

  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-node.demo.rovr.dev
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
  externalSecrets:
    enabled: true

    data:
    - key: /k8s/common/sample-node/redis-password
      name: REDIS_PASS


redis:
  enabled: true
  global:
    storageClass: gp3
  istio:
    sidecar:
      inject: true

  master:
    persistence:
      enabled: true
      size: 8Gi
