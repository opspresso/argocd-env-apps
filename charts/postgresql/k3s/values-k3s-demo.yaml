global:
  ssmPrefix: /k8s/k3s-demo

postgresql:
  primary:

    # Docker Official PostgreSQL applies these flags to existing data directories.
    args: ["-c", "max_connections=250", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=1GB", "-c", "work_mem=4MB"]


    persistence:
      size: 5Gi



    resources: null
bootstrap:
  jobResources: null