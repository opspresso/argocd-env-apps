raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: postgresql-credentials
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: parameter-store
        target:
          name: postgresql-credentials
          creationPolicy: Owner
        data:
          - secretKey: postgres-password
            remoteRef:
              key: /k8s/eks-demo-b/agent-studio/postgres-password
          - secretKey: password
            remoteRef:
              key: /k8s/eks-demo-b/agent-studio/postgres-password



# A pinned PostgreSQL client runs the idempotent server-side extension setup as the user and Secret
# of global.postgresql.auth in values.yaml.
bootstrap:
  resources:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: postgres-bootstrap
        annotations:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
          argocd.argoproj.io/sync-wave: "1"
      spec:
        backoffLimit: 12
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: bootstrap
                image: pgvector/pgvector:0.8.6-pg18-trixie
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 1Gi
                env:
                  - name: PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-credentials
                        key: postgres-password
                command:
                  - sh
                  - -ec
                  - |
                    until pg_isready -h postgres -U agent_studio -d postgres; do sleep 2; done
                    psql -h postgres -U agent_studio -d postgres -v ON_ERROR_STOP=1 <<'SQL'
                    SELECT 'CREATE DATABASE agent_platform OWNER agent_studio'
                    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agent_platform')\gexec
                    SQL
                    psql -h postgres -U agent_studio -d agent_platform -v ON_ERROR_STOP=1 \
                      -c "CREATE EXTENSION IF NOT EXISTS vector;"