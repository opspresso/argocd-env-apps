externalSecrets:
  enabled: true

global:
  security:
    allowInsecureImages: true
  postgresql:
    auth:
      username: agent_studio
      database: agent_platform
      existingSecret: postgresql-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password

postgresql:
  fullnameOverride: postgres

  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: 0.8.6-pg18-trixie
    pullPolicy: IfNotPresent

  # pgvector uses the Docker Official PostgreSQL entrypoint, not Bitnami's.
  auth:
    usePasswordFiles: false
    enablePostgresUser: false
  postgresqlDataDir: /var/lib/postgresql/data
  serviceAccount:
    create: false
    name: default
  volumePermissions:
    enabled: false
  shmVolume:
    enabled: false

  primary:
    terminationGracePeriodSeconds: 60
    automountServiceAccountToken: true
    podSecurityContext:
      fsGroup: 999
    containerSecurityContext:
      enabled: false
    resourcesPreset: none
    pdb:
      create: false
    networkPolicy:
      enabled: false
    extraEnvVars:
      - name: POSTGRES_DB
        value: '{{ include "postgresql.v1.database" . }}'
    customReadinessProbe:
      exec:
        command: [sh, -ec, 'pg_isready -U "${POSTGRES_USER}" -d postgres -h 127.0.0.1 -p 5432']
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    customLivenessProbe:
      exec:
        command: [sh, -ec, 'pg_isready -U "${POSTGRES_USER}" -d postgres -h 127.0.0.1 -p 5432']
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    initdb:
      scripts:
        00-agent-platform.sql: |
          SELECT 'CREATE DATABASE agent_platform OWNER agent_studio'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agent_platform')\gexec

    persistence:
      mountPath: /var/lib/postgresql
      volumeName: data
      enabled: true
      size: 5Gi
    resources:
      # agent-studio working set p95 666Mi, peak 827Mi; CPU p95 32m (7 days to 2026-11-11).
      requests:
        cpu: 40m
        memory: 832Mi
      limits:
        cpu: 2000m
        memory: 2Gi

# raw renders the ExternalSecret and bootstrap the idempotent server-side setup Job. Both lists are
# raw.resources in values-template.yaml.j2: they carry the cluster's SSM path and the env's resource
# budget, and Helm replaces a values list instead of merging it.
bootstrap:
  enabled: true
