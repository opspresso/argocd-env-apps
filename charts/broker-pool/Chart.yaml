apiVersion: v2
name: broker-pool
description: Shared PostgreSQL pool for Agent Broker dev resources
type: application
version: v1.0.0
appVersion: 18.6.0-pgvector
dependencies:
- name: postgresql
  repository: oci://registry-1.docker.io/bitnamicharts
  version: 18.12.4
- name: raw
  repository: https://charts.helm.sh/incubator
  version: 0.2.5
  condition: externalSecrets.enabled
- name: raw
  alias: bootstrap
  repository: https://charts.helm.sh/incubator
  version: 0.2.5
  condition: bootstrap.enabled
