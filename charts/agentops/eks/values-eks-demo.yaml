app:
  fullnameOverride: agentops
  ecrPullSecret:
    enabled: True
    region: ap-northeast-2
  # One policy covers both workloads of this release. The ingress gateway reaches the console; the console reaches
  # Identity in the same namespace; the platform services reach Identity's key set and token endpoint.
  networkPolicy:
    enabled: True
    appPort:
      sameNamespace: true
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      namespaces: [agent-studio, agent-models, agent-memory, agent-knowledge, agent-forge, agent-runway]

  replicaCount: 1
  autoscaling:
    enabled: True
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agentops

  configmap:
    enabled: true
    data:
      PORT: '3000'
      STAGE: prod
      # The console's name and copyright. The copyright is the Studio one, so the console and Studio screens match.
      PRODUCT_NAME: AgentOps
      PRODUCT_COPYRIGHT: "\u00a9 OpsPresso. All rights reserved."
      # One session read per request and an occasional preference write, each a few milliseconds; service calls never
      # hold a connection. Four per process keeps the shared PostgreSQL budget (tests/test_production_capacity.py).
      DATABASE_POOL_SIZE: '4'
      # The console's own origin: sign-in callback /api/auth/callback, Origin check and absolute links. Every service's
      # CONSOLE_BASE_URL is this origin.
      AUTH_BASE_URL: https://agentops.agrt.dev
      # AgentOps Identity (workload identity below): the console exchanges the session cookie there for 60-second tokens.
      IDENTITY_URL: http://agentops-identity:3000/identity
      # Service addresses. AgentOps calls each service at its public host for now. A service may move to its in-cluster
      # address later, together with its allowed hosts and NetworkPolicy. A service left out here is not offered in the
      # console.
      STUDIO_API_URL: https://studio.agrt.dev
      # The Studio address people see: the Agent API base, webhook addresses and the MCP address in the connection guide.
      # It stays the public host when STUDIO_API_URL moves in-cluster.
      STUDIO_PUBLIC_URL: https://studio.agrt.dev
      MEMORY_API_URL: https://memory.agrt.dev
      KNOWLEDGE_API_URL: https://knowledge.agrt.dev
      FORGE_API_URL: https://forge.agrt.dev
      MODELS_API_URL: https://models.agrt.dev

      RUNWAY_API_URL: https://runway.agrt.dev

  externalSecrets:
    enabled: true
    data:
    - key: /k8s/eks-demo/agent-platform/database-url
      name: DATABASE_URL
    # The console's client secret at AgentOps Identity (client console). The console signs and seals nothing.
    - key: /k8s/eks-demo/agentops-identity/client-secret-console
      name: IDENTITY_CLIENT_SECRET_CONSOLE
  routing:
    hosts:
    - agentops.agrt.dev
    httpRoute:
      enabled: true
  # core_tier: the base replicas prefer the on-demand core nodes (terraform-env-demo 51-core-node-pool.tf), one per AZ.
  # HPA growth and rollout surge spill over to Spot instead of waiting for core room.
  tolerations:
    - key: opspresso.com/tier
      operator: Equal
      value: core
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: opspresso.com/tier
                operator: In
                values: [core]
  # Spread the replicas over AZs and nodes so one lost node leaves a replica serving.
  # ScheduleAnyway: a replica still starts when one AZ has no capacity.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agentops
      matchLabelKeys: [pod-template-hash]
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agentops
      matchLabelKeys: [pod-template-hash]
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://agentops.agrt.dev
  workloads:
    # AgentOps Identity: the platform's sign-in, people, teams and token issuer. Same image as the console with
    # AGENTOPS_ROLE=identity. Cluster-internal: the console relays /identity/* and /api/auth/callback from the public
    # host, and the services reach it at agentops-identity.agentops.svc.cluster.local.
    identity:
      fullnameOverride: agentops-identity
      replicaCount: 2
      overrides: |
        image: {{ toYaml .Values.image | nindent 2 }}
      service:
        enabled: true
        name: http
        port: 3000
        targetPort: 3000
      resources:
        requests:
          cpu: 10m
          memory: 160Mi
        limits:
          memory: 512Mi
      readinessProbe:
        httpGet:
          path: /api/ready
          port: 3000
        initialDelaySeconds: 5
        timeoutSeconds: 6
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /api/health
          port: 3000
        timeoutSeconds: 2
        periodSeconds: 10
      startupProbe:
        httpGet:
          path: /api/health
          port: 3000
        timeoutSeconds: 2
        periodSeconds: 5
        failureThreshold: 60
      terminationGracePeriodSeconds: 30
      lifecycle:
        preStop:
          exec:
            command: [/bin/sh, -c, sleep 10]
      pdb:
        enabled: true
        maxUnavailable: 1
      automountServiceAccountToken: false
      podLabels:
        sidecar.istio.io/inject: 'true'
      configmap:
        enabled: true
        data:
          AGENTOPS_ROLE: identity
          PORT: '3000'
          STAGE: prod
          DATABASE_POOL_SIZE: '4'
          # The public console origin: the token issuer is <AUTH_BASE_URL>/identity and the IdP returns to
          # <AUTH_BASE_URL>/api/auth/callback.
          AUTH_BASE_URL: https://agentops.agrt.dev
          # The platform Dex (argocd-env-addons charts/dex, client agentops-identity) in front of LLDAP. Dex passes
          # name, email and groups; sub is the stable subject and email the person's address.
          OIDC_ISSUER: https://sso.demo.opsp.dev

          # Git hosts people connect in Profile > Git accounts; Studio, Forge and Runway take user tokens from Identity.
          # Each OAuth application's redirect URI is https://<agentops.hostname>/api/git/callback. The client secret of
          # a host is the key <name> of the JSON in /k8s/<cluster>/agentops-identity/git-host-secrets.
          GIT_HOSTS: "[{\"clientId\": \"Ov23liWo0mJ9kFk43v9N\", \"name\": \"github\", \"origin\": \"https://github.com\", \"provider\": \"github\"}, {\"clientId\": \"2ecdaea4aa0015547c53779a63d5419b3d09a5adb3d80e760d282f84afb9aef4\", \"name\": \"gitlab\", \"origin\": \"https://gitlab.com\", \"provider\": \"gitlab\"}, {\"clientId\": \"agent-studio-git\", \"name\": \"gitlab-demo\", \"origin\": \"https://gitlab.demo.opsp.dev\", \"provider\": \"gitlab\"}, {\"clientId\": \"f7f13c8a-a268-46a2-830a-3b5d820bdbc0\", \"name\": \"gitea-demo\", \"origin\": \"https://gitea.demo.opsp.dev\", \"provider\": \"gitea\"}]"
      externalSecrets:
        enabled: true
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: secrets-manager
        data:
        - key: /k8s/eks-demo/agent-platform/database-url
          name: DATABASE_URL
        - key: /k8s/eks-demo/agentops-identity/auth-secret
          name: AUTH_SECRET
        - key: /k8s/eks-demo/agentops-identity/encryption-key
          name: AES_ENCRYPTION_KEY
        - key: /k8s/eks-demo/agentops-identity/organization-id
          name: IDENTITY_ORGANIZATION_ID
        - key: /k8s/eks-demo/agentops-identity/admin-emails
          name: ADMIN_EMAILS
        - key: /k8s/eks-demo/agentops-identity/oidc-client-id
          name: OIDC_CLIENT_ID
        - key: /k8s/eks-demo/agentops-identity/oidc-client-secret
          name: OIDC_CLIENT_SECRET
        - key: /k8s/eks-demo/agentops-identity/git-host-secrets
          name: GIT_HOST_SECRETS

        - key: /k8s/eks-demo/agentops-identity/client-secret-console
          name: IDENTITY_CLIENT_SECRET_CONSOLE

        - key: /k8s/eks-demo/agentops-identity/client-secret-studio
          name: IDENTITY_CLIENT_SECRET_STUDIO

        - key: /k8s/eks-demo/agentops-identity/client-secret-memory
          name: IDENTITY_CLIENT_SECRET_MEMORY

        - key: /k8s/eks-demo/agentops-identity/client-secret-knowledge
          name: IDENTITY_CLIENT_SECRET_KNOWLEDGE

        - key: /k8s/eks-demo/agentops-identity/client-secret-forge
          name: IDENTITY_CLIENT_SECRET_FORGE

        - key: /k8s/eks-demo/agentops-identity/client-secret-runway
          name: IDENTITY_CLIENT_SECRET_RUNWAY

        - key: /k8s/eks-demo/agentops-identity/client-secret-models
          name: IDENTITY_CLIENT_SECRET_MODELS


