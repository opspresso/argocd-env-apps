raw:
  resources:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: delivery-pool-credentials
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
      spec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: secrets-manager
        target:
          name: delivery-pool-credentials
          creationPolicy: Owner
        data:
          - secretKey: postgres-password
            remoteRef:
              key: /k8s/eks-demo/delivery-pool/postgres-password
          - secretKey: delivery-admin-password
            remoteRef:
              key: /k8s/eks-demo/agent-runway/pool-admin-password
    # Delivery manages databases; Forge Sandboxes and Delivery tenant namespaces use them.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: postgres
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: postgresql
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector: {}
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: agent-runway
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: agent-forge-workspaces
              - namespaceSelector:
                  matchLabels:
                    opspresso.com/delivery-tenant: "true"
            ports:
              - protocol: TCP
                port: 5432

postgresql:
  primary:

    # Every deployed app with a `pool-postgres` resource shares this database, so a restart stops all of them.
    # It runs only on the on-demand core nodes (terraform-env-demo 51-core-node-pool.tf); its EBS volume picks the AZ.
    tolerations:
      - key: opspresso.com/tier
        operator: Equal
        value: core
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: opspresso.com/tier
                  operator: In
                  values: [core]
    # Delays voluntary disruption only: drift (03:00-05:00 KST window) and expiry still drain it after at most the NodeClaim terminationGracePeriod, restarting it once.
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"


    persistence:
      size: 10Gi

      storageClass: gp3


