app:
  fullnameOverride: agent-forge
  raw:
    enabled: True

  replicaCount: 0
  autoscaling:
    enabled: False
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-forge
  imagePullSecrets:
    - name: ecr-registry

  ingressPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system

    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: addon-prometheus
  registry:
    region: ap-northeast-2
  ssmPrefix: /k8s/eks-demo
  configmap:
    enabled: true
    data:
      HOST: 0.0.0.0
      PORT: '3103'
      AUTH_BASE_URL: https://forge.agrt.dev
      ALLOWED_ORIGINS: https://forge.agrt.dev
      FORGE_WORKER_ENABLED: 'true'
      FORGE_SANDBOX_PROVIDER: kubernetes
      FORGE_KUBE_IMAGE_PULL_SECRET: ecr-registry
      FORGE_KUBE_NODE_POOL: 'workspaces'
      FORGE_GIT_ALLOWED_ORIGINS: https://github.com
      # Studio is the only sign-in authority; the callback is /api/auth/callback/studio.
      OIDC_ISSUER: https://studio.agrt.dev/api/auth
      OIDC_PROVIDER_ID: studio
      # Internal Studio origin for the native forge:policy callback.
      STUDIO_URL: http://agent-studio.agent-studio.svc.cluster.local:3000
      MODELS_URL: http://agent-models.agent-models.svc.cluster.local:3400
  sandbox:
    namespace: agent-forge-workspaces
    maxPods: 32
    memoryMb: 2048
    diskMb: 2048
    cpus: 1
    dnsCidrs:
      - 172.20.0.10/32
    allowPublic: True
    extraEgress: []
  routing:
    hosts:
    - forge.agrt.dev
    httpRoute:
      enabled: true


  podLabels:
    sidecar.istio.io/inject: "true"

  podAnnotations:
    link.argocd.argoproj.io/external-link: https://forge.agrt.dev
    # Forge reads FORGE_MODEL_CHANNELS only at startup. After editing the model-roles SSM
    # parameter, wait one refreshInterval, then set this to the parameter version to restart Forge.
    agent-forge/model-roles-version: "1"
  externalSecrets:
    enabled: true
    # Upper bound for an SSM edit to reach the Secret.
    refreshInterval: 15m
    data:
    - key: /k8s/eks-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/eks-demo/agent-forge/checkpoint-secret
      name: FORGE_CHECKPOINT_SECRET
    - key: /k8s/eks-demo/agent-forge/credential-secret
      name: FORGE_GIT_CREDENTIAL_SECRET
    - key: /k8s/eks-demo/agent-forge/model-secret
      name: FORGE_MODEL_SECRET
    # Central selection IDs per runtime role; see docs/agent-platform.md.
    - key: /k8s/eks-demo/agent-forge/model-roles
      name: FORGE_MODEL_CHANNELS
    - key: /k8s/eks-demo/agent-forge/oidc-client-id
      name: OIDC_CLIENT_ID
    - key: /k8s/eks-demo/agent-forge/oidc-client-secret
      name: OIDC_CLIENT_SECRET
    - key: /k8s/eks-demo/agent-forge/organization-id
      name: FORGE_ORGANIZATION_ID
    - key: /k8s/eks-demo/agent-forge/session-secret
      name: AUTH_SECRET
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
