app:
  fullnameOverride: agent-forge
  raw:
    enabled: True

  replicaCount: 1
  autoscaling:
    enabled: True
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-forge
  imagePullSecrets:
    - name: ecr-registry

  ingressPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: addon-prometheus
  registry:
    region: ap-northeast-2
  ssmPrefix: /k8s/eks-demo
  configmap:
    enabled: true
    data:
      HOSTNAME: 0.0.0.0
      PORT: '3103'
      AUTH_BASE_URL: https://forge.agrt.dev
      ALLOWED_ORIGINS: https://forge.agrt.dev
      FORGE_WORKER_ENABLED: 'true'
      FORGE_SANDBOX_PROVIDER: kubernetes
      FORGE_KUBE_IMAGE_PULL_SECRET: ecr-registry
      FORGE_KUBE_NODE_POOL: 'workspaces'
      FORGE_GIT_ALLOWED_ORIGINS: https://github.com
      # Studio is the only sign-in authority; the callback is /api/auth/callback/studio.
      OIDC_ISSUER: https://studio.agrt.dev/api/auth
      OIDC_PROVIDER_ID: studio
      MODELS_URL: http://agent-models.agent-models.svc.cluster.local:3400
      # Required: every env declares agent_forge.model_roles ([] when it has no role).
      FORGE_MODEL_CHANNELS: "[{\"id\": \"openrouter/minimax-m3.1-flash\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/minimax-m3.1-flash\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}, {\"id\": \"openrouter/deepseek-v4.1-flash\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/deepseek-v4.1-flash\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}, {\"id\": \"openrouter/glm-5.3\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/glm-5.3\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}, {\"id\": \"openrouter/gpt-6-luna\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/gpt-6-luna\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}, {\"id\": \"openrouter/gpt-6.1-sol\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/gpt-6.1-sol\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}, {\"id\": \"openrouter/gpt-6-astra\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/gpt-6-astra\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}, {\"id\": \"openrouter/claude-opus-5.5\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/claude-opus-5.5\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}, {\"id\": \"openrouter/claude-sonnet-5.5\", \"maxOutputTokens\": 8192, \"maxRequestsPerRun\": 100, \"model\": \"openrouter/claude-sonnet-5.5\", \"protocol\": \"chat/completions\", \"runtime\": \"opencode\"}]"
      # Run start materializes the Project's dev variables (agent-platform docs/DELIVERY_RESOURCES.md).
      RUNWAY_URL: http://agent-runway.agent-runway.svc.cluster.local:3500
  sandbox:
    namespace: agent-forge-workspaces
    maxPods: 32
    memoryMb: 2048
    diskMb: 2048
    cpus: 1
    dnsCidrs:
      - 172.20.0.10/32
    allowPublic: True
    # Sandbox apps connect to retired pool databases and to the postgres and valkey servers of each Project's sandbox
    # environment. The server NetworkPolicy and its password decide which Project a Sandbox reaches.
    extraEgress: [{"ports": [{"port": 5432, "protocol": "TCP"}], "to": [{"namespaceSelector": {"matchLabels": {"kubernetes.io/metadata.name": "delivery-pool"}}}]}, {"ports": [{"port": 5432, "protocol": "TCP"}, {"port": 6379, "protocol": "TCP"}], "to": [{"namespaceSelector": {"matchLabels": {"opspresso.com/delivery-env": "dev", "opspresso.com/delivery-tenant": "true"}}}]}]
  routing:
    hosts:
    - forge.agrt.dev
    httpRoute:
      enabled: true
  # Every eks-demo node is Spot. Spread the replicas over AZs and nodes so one reclaim leaves a replica serving.
  # ScheduleAnyway: a replica still starts when one AZ has no Spot capacity.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-forge
      matchLabelKeys: [pod-template-hash]
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-forge
      matchLabelKeys: [pod-template-hash]
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://forge.agrt.dev
  externalSecrets:
    enabled: true
    # Upper bound for an SSM edit to reach the Secret.
    refreshInterval: 15m
    data:
    - key: /k8s/eks-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/eks-demo/agent-forge/checkpoint-secret
      name: FORGE_CHECKPOINT_SECRET
    - key: /k8s/eks-demo/agent-forge/git-credential-secret
      name: FORGE_GIT_CREDENTIAL_SECRET
    - key: /k8s/eks-demo/agent-forge/model-secret
      name: FORGE_MODEL_SECRET
    - key: /k8s/eks-demo/agent-forge/oidc-client-id
      name: OIDC_CLIENT_ID
    - key: /k8s/eks-demo/agent-forge/oidc-client-secret
      name: OIDC_CLIENT_SECRET
    - key: /k8s/eks-demo/agent-forge/organization-id
      name: FORGE_ORGANIZATION_ID
    - key: /k8s/eks-demo/agent-forge/auth-secret
      name: AUTH_SECRET
    # Forge-owned GitHub OAuth app; callback https://<forge host>/api/github/callback.
    - key: /k8s/eks-demo/agent-forge/github-client-id
      name: FORGE_GITHUB_CLIENT_ID
    - key: /k8s/eks-demo/agent-forge/github-client-secret
      name: FORGE_GITHUB_CLIENT_SECRET
    # Static scrape credential for /metrics, shared with Alloy and the ServiceMonitor.
    - key: /k8s/eks-demo/agent-forge/metrics-bearer-token
      name: METRICS_BEARER_TOKEN
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
