app:
  fullnameOverride: agent-forge
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-forge
    tag: latest
  # Working set p99 184Mi, 10-day peak 404Mi; CPU p95 15m (7 days to 2026-11-13).
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 1Gi
  service:
    name: http
    port: 3000
    targetPort: 3000
    # Sandboxes call the model proxy only on this port; 3000 answers /model/ with 404.
    extraPorts:
    - name: sandbox
      port: 3001
      targetPort: sandbox
      protocol: TCP
  extraPorts:
  - name: sandbox
    containerPort: 3001
    protocol: TCP
  controller:
    strategy:
      rollingUpdate:
        maxSurge: 100%
        maxUnavailable: 0
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /ready
      port: 3000
    initialDelaySeconds: 5
    timeoutSeconds: 6
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    timeoutSeconds: 2
    initialDelaySeconds: 10
    periodSeconds: 10
  startupProbe:
    httpGet:
      path: /health
      port: 3000
    timeoutSeconds: 2
    periodSeconds: 5
    failureThreshold: 60
  terminationGracePeriodSeconds: 180
  lifecycle:
    preStop:
      exec:
        command:
        - /bin/sh
        - -c
        - sleep 15
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 2
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  serviceMonitor:
    enabled: true
    endpoints:
    - interval: 15s
      path: /metrics
      port: http
      authorization:
        type: Bearer
        credentials:
          name: agent-forge-metrics
          key: token
  routing:
    httpRoute:
      parentRefs:
      - name: istio-ingressgateway
        namespace: istio-system
  serviceAccount:
    create: true
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: secrets-manager
  ecrPullSecret:
    enabled: true
    region: ap-northeast-2
    # Sandbox Pods pull the sandbox image with the same Secret.
    namespaces: [agent-forge-workspaces]
  # The sandbox image is released with the server image as sandbox-<tag>. The other FORGE_SANDBOX_* and FORGE_KUBE_*
  # settings are cluster values in values-template.yaml.j2.
  configmap:
    tpl: true
    data:
      FORGE_SANDBOX_IMAGE: '{{ printf "%s:sandbox-%s" .Values.image.repository .Values.image.tag }}'
  networkPolicy:
    enabled: true
    appPort:
      sameNamespace: true
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: istio-system
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: addon-prometheus
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: addon-alloy
      namespaces: [agent-studio]
    ingress:
      # Sandbox Pods reach only the model proxy port (service.extraPorts[sandbox]); 3000 answers /model/ with 404.
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: agent-forge-workspaces
            podSelector:
              matchLabels:
                app.kubernetes.io/name: agent-forge-sandbox
        ports:
          - protocol: TCP
            port: 3001
      # Prometheus scrapes the Istio sidecar's Envoy stats on 15090 (PodMonitor istio-system/istio-sidecars).
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: addon-prometheus
        ports:
          - protocol: TCP
            port: 15090
  automountServiceAccountToken: true
