app:
  fullnameOverride: agent-forge
  raw:
    enabled: True


  replicaCount: 1
  autoscaling:
    enabled: False
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-forge
  imagePullSecrets:
    - name: ecr-registry

  resources: null

  ingressPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system

      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system

    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: addon-alloy
  registry:
    region: ap-northeast-2
  ssmPrefix: /k8s/k3s-demo
  configmap:
    enabled: true
    data:
      HOST: 0.0.0.0
      PORT: '3103'
      AUTH_BASE_URL: https://forge.agrt.dev
      ALLOWED_ORIGINS: https://forge.agrt.dev
      FORGE_WORKER_ENABLED: 'true'
      FORGE_SANDBOX_PROVIDER: kubernetes
      FORGE_KUBE_IMAGE_PULL_SECRET: ecr-registry
      FORGE_KUBE_NODE_POOL: ''
      FORGE_GIT_ALLOWED_ORIGINS: https://github.com
      # The default sign-in uses the Agent Memory Google client; an explicit oidc block overrides it.
      # Register the chosen provider identity on each callback, for example
      # https://<hostname>/api/auth/callback/google.

      OIDC_ISSUER: https://accounts.google.com
      OIDC_PROVIDER_ID: google

      ALLOWED_EMAIL_DOMAINS: 'nalbam.com'
  sandbox:
    namespace: agent-forge-workspaces
    maxPods: 2
    memoryMb: 1024
    diskMb: 2048
    cpus: 1
    dnsCidrs:
      - 10.43.0.10/32
    allowPublic: True
    extraEgress: []
  routing:
    hosts:
    - forge.agrt.dev
    httpRoute:
      enabled: true

      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway


  podAnnotations:
    link.argocd.argoproj.io/external-link: https://forge.agrt.dev
    # Forge reads FORGE_MODEL_CHANNELS only at startup. After editing the model-channels SSM
    # parameter, wait one refreshInterval, then set this to the parameter version to restart Forge.
    agent-forge/model-channels-version: "3"
  externalSecrets:
    enabled: true
    # Upper bound for an SSM edit to reach the Secret.
    refreshInterval: 15m
    data:
    - key: /k8s/k3s-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/k3s-demo/agent-forge/credentials
      name: FORGE_CREDENTIALS
    - key: /k8s/k3s-demo/agent-forge/delegators
      name: FORGE_DELEGATORS
    - key: /k8s/k3s-demo/agent-forge/issuer-policies
      name: FORGE_ISSUER_POLICIES
    - key: /k8s/k3s-demo/agent-forge/checkpoint-secret
      name: FORGE_CHECKPOINT_SECRET
    - key: /k8s/k3s-demo/agent-forge/credential-secret
      name: FORGE_GIT_CREDENTIAL_SECRET
    - key: /k8s/k3s-demo/agent-forge/model-secret
      name: FORGE_MODEL_SECRET
    - key: /k8s/k3s-demo/agent-forge/model-channels
      name: FORGE_MODEL_CHANNELS

    - key: /k8s/common/agent-memory/google-client-id
      name: OIDC_CLIENT_ID
    - key: /k8s/common/agent-memory/google-client-secret
      name: OIDC_CLIENT_SECRET

    - key: /k8s/k3s-demo/agent-forge/organization-id
      name: FORGE_ORGANIZATION_ID
    - key: /k8s/k3s-demo/agent-forge/session-secret
      name: AUTH_SECRET
  serviceMonitor:
    enabled: false
    labels:
      release: prometheus-k3s-demo
