# Grafana MCP server Agent Studio calls.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. Agent Studio
# reaches it at mcp-grafana.agent-mcps.svc.cluster.local.
#
# Deliberately absent, and not an oversight: the HPA, PDB and long
# terminationGracePeriod that agent-studio carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one Grafana query, so
# the chart defaults are right and a copied 660s grace period would only make
# every rollout eleven minutes long.

app:
  fullnameOverride: mcp-grafana

  image:
    repository: grafana/mcp-grafana

  # `--address 0.0.0.0:8000` is load-bearing. The default is localhost:8000,
  # which binds inside the pod's own namespace only — the Service would resolve,
  # connect, and hang forever on a listener no other pod can reach.
  #
  # `--allowed-hosts` is the other half of that change, and it is not optional.
  # The server validates the Host header against loopback variants of --address
  # by default (DNS-rebinding protection), so widening the bind address without
  # widening this answers 403 to everything that is not localhost — including the
  # kubelet probe, which is what put this in a restart loop the first time.
  #
  # Matching is exact, verified against the running image: an entry with the port
  # and one without are different values, and `mcp-grafana.agent-mcps` does not
  # match `mcp-grafana.agent-mcps.svc.cluster.local`. So every form a caller may
  # use is listed. The pod IP cannot be — it changes every restart, which is why
  # the probes below send a Host header instead.
  args:
    - "--transport"
    - "streamable-http"
    - "--address"
    - "0.0.0.0:8000"
    - "--allowed-hosts"
    - "mcp-grafana.agent-mcps.svc.cluster.local,mcp-grafana.agent-mcps.svc,mcp-grafana.agent-mcps,mcp-grafana,localhost:8000,localhost"
    # Lists only read tools. It also removes the raw SQL tools (query_sql,
    # query_influxdb); `--enable-query` is not set because raw SQL can write.
    - "--disable-write"

  service:
    name: http
    targetPort: 8000

  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # kubelet sends the pod IP as the Host header, which the allowlist above cannot
  # contain because it changes on every restart. Naming one explicitly is what
  # lets the check stay on for real traffic.
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8000
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  serviceAccount:
    create: true

  # Hash repeated session requests in the mesh. Current deployments use one
  # replica. Verify session creation, reconnect and rollout behavior before
  # increasing the replica count; backend replacement can lose session-local state.
  destinationRule:
    enabled: true
    trafficPolicy:
      loadBalancer:
        consistentHash:
          httpHeaderName: mcp-session-id

networkPolicy:
  enabled: true

# Only Agent Studio processes that run Agents may call this server. The MCP has
# no authentication, so this ingress rule is its access boundary.
raw:
  resources:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: mcp-grafana
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: mcp-grafana
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: agent-studio
                podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [agent-studio]
            ports:
              - protocol: TCP
                port: 8000
