app:
  fullnameOverride: agent-memory
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-memory
    tag: latest
  # The limit covers a measured 530Mi peak under concurrent recalls; working set
  # p95 is 207Mi (7 days to 2026-11-10).
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  service:
    name: http
    port: 3000
    targetPort: 3000
  controller:
    strategy:
      rollingUpdate:
        maxSurge: 100%
        maxUnavailable: 0
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/ready
      port: 3000
    initialDelaySeconds: 5
    timeoutSeconds: 6
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    timeoutSeconds: 2
    initialDelaySeconds: 10
    periodSeconds: 10
  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    timeoutSeconds: 2
    periodSeconds: 5
    failureThreshold: 60
  terminationGracePeriodSeconds: 660
  lifecycle:
    preStop:
      exec:
        command:
        - /bin/sh
        - -c
        - sleep 15
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  serviceMonitor:
    enabled: true
    endpoints:
    - interval: 15s
      path: /api/metrics
      port: http
      authorization:
        type: Bearer
        credentials:
          name: agent-memory-external
          key: METRICS_BEARER_TOKEN
  routing:
    httpRoute:
      parentRefs:
      - name: istio-ingressgateway
        namespace: istio-system
  serviceAccount:
    create: true
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store
  ecrPullSecret:
    enabled: true
    region: ap-northeast-2
  automountServiceAccountToken: false
  networkPolicy:
    enabled: true
    appPort:
      sameNamespace: true
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: istio-system
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: addon-prometheus
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: addon-alloy
      namespaces:
      - agent-studio
    ingress:
    # Prometheus scrapes the Istio sidecar's Envoy stats on 15090 (PodMonitor istio-system/istio-sidecars).
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: addon-prometheus
      ports:
      - protocol: TCP
        port: 15090
