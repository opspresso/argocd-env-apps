app:
  fullnameOverride: agent-memory

  replicaCount: 1
  autoscaling:
    enabled: False
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-memory

  imagePullSecrets:
    - name: ecr-registry


  resources: null

  configmap:
    enabled: true
    data:
      AWS_REGION: ap-northeast-2
      DATABASE_POOL_SIZE: '4'
      AUTH_BASE_URL: https://memory.agrt.dev
      # Studio is the only sign-in authority; the callback is /api/auth/callback/studio.
      OIDC_ISSUER: https://studio.agrt.dev/api/auth
      OIDC_PROVIDER_ID: studio
      AUTH_ALLOWED_HOSTS: 'memory.agrt.dev'
      TRUSTED_PROXY_CIDRS: ''
      # Providers and credentials belong to Agent Models. Select each model role in Settings.
      MODELS_URL: http://agent-models.agent-models.svc.cluster.local:3400
      EMBEDDING_MIN_SCORE: '0.2'
      RERANKER_TIMEOUT_MS: '5000'
      RERANKER_MIN_SCORE: '0.05'
      DECISION_TIMEOUT_MS: '5000'
      MEMORY_LANGUAGE: ko
      DREAM_TIME_ZONE: Asia/Seoul
  routing:
    hosts:
    - memory.agrt.dev
    httpRoute:
      enabled: true

      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway


  podAnnotations:
    link.argocd.argoproj.io/external-link: https://memory.agrt.dev

  externalSecrets:
    enabled: true
    data:
    - key: /k8s/common/agent-memory/better-auth-secret
      name: AUTH_SECRET
    - key: /k8s/k3s-demo/agent-memory/oidc-client-id
      name: OIDC_CLIENT_ID
    - key: /k8s/k3s-demo/agent-memory/oidc-client-secret
      name: OIDC_CLIENT_SECRET
    - key: /k8s/k3s-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/k3s-demo/agent-memory/metrics-bearer-token
      name: METRICS_BEARER_TOKEN

  serviceMonitor:
    enabled: false
    labels:
      release: prometheus-k3s-demo
  ingressPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system

      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system

    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: addon-alloy
  registry:
    region: ap-northeast-2
