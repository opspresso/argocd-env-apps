externalSecrets:
  enabled: true

minio:
  fullnameOverride: minio

  global:
    security:
      allowInsecureImages: true

  image:
    repository: bitnamilegacy/minio
  clientImage:
    repository: bitnamilegacy/minio-client

  mode: standalone
  defaultBuckets: agent-studio-static,agent-memory,agent-knowledge

  auth:
    rootUser: agent-studio
    existingSecret: minio-credentials
    rootUserSecretKey: root-user
    rootPasswordSecretKey: root-password

  persistence:
    enabled: true
    size: 10Gi

  resourcesPreset: none
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  console:
    image:
      repository: bitnamilegacy/minio-object-browser
    resourcesPreset: none
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  defaultInitContainers:
    volumePermissions:
      resourcesPreset: none
      resources: null
  provisioning:
    resourcesPreset: none
    resources: null

raw:
  templates:
    - |
        {{- $ssmPrefix := required "ssmPrefix is required; include <platform>/values-<cluster>.yaml" .Values.global.ssmPrefix -}}
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: minio-credentials
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: parameter-store
          target:
            name: minio-credentials
            creationPolicy: Owner
          data:
            - secretKey: root-user
              remoteRef:
                key: {{ $ssmPrefix }}/agent-studio/minio-root-user
            - secretKey: root-password
              remoteRef:
                key: {{ $ssmPrefix }}/agent-studio/minio-root-password

storageGc:
  enabled: false
  templates:
    - |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: minio
          namespace: {{ .Release.Namespace }}
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: minio
              app.kubernetes.io/part-of: minio
          policyTypes: [Ingress, Egress]
          ingress: []
          egress: [{}]
