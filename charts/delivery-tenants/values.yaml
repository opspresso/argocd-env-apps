# The admission policy that keeps the Runway tenant secrets role inside its own Project namespace.
# argocd-env-projects charts/app creates the namespaces app-<project>-<env> and their SecretStores
# (agent-platform docs/APP_DELIVERY.md); this policy guards every SecretStore in the cluster.
global:
  delivery:
    tenantSecretsRoleArn: ""
    # What the Agent Runway ServiceAccount may submit to the Delivery namespace. argocd-env-projects charts/delivery
    # grants it create on Workflows and Secrets there; this policy narrows both to the shapes Runway sends
    # (agent-runway src/infrastructure/workflow/argo.ts). The raw chart reads only global values.
    submissions:
      namespace: app-delivery
      user: system:serviceaccount:agent-runway:agent-runway
      # The WorkflowTemplates of argocd-env-projects charts/delivery (RUNWAY_*_TEMPLATE defaults): build, the eks and
      # eb target deploy and remove, and the namespace resource sync.
      workflowTemplates: [app-build, app-deploy, app-remove, app-deploy-eb, app-remove-eb, resource-sync]

raw:
  # The raw chart renders one document per template, so all tenant objects form one v1 List.
  templates:
    - |
      # The tenant secrets role reads any Project's path that its session tags name, so the cluster,
      # not AWS, decides which store may assume it. The policy therefore checks every SecretStore and
      # ClusterSecretStore, not only stores in tenant namespaces:
      # - a tenant namespace may only use the tenant role, and
      # - the tenant role is only valid in namespace app-<project>-<env> whose labels equal the tags.
      # Matching the name as well as the labels stops a relabelled namespace from posing as a Project.
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: delivery-tenant-secret-stores
      spec:
        failurePolicy: Fail
        matchConstraints:
          resourceRules:
            - apiGroups: [external-secrets.io]
              apiVersions: ["*"]
              operations: [CREATE, UPDATE]
              resources: [secretstores, clustersecretstores]
        variables:
          - name: aws
            expression: "has(object.spec.provider) && has(object.spec.provider.aws) ? object.spec.provider.aws : null"
          - name: tenantRole
            expression: "variables.aws != null && has(variables.aws.role) && (variables.aws.role == '{{ required "tenantSecretsRoleArn is required" .Values.global.delivery.tenantSecretsRoleArn }}')"
          - name: labels
            expression: "namespaceObject != null && has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {}"
          - name: tenantNamespace
            expression: "'opspresso.com/delivery-tenant' in variables.labels && variables.labels['opspresso.com/delivery-tenant'] == 'true'"
          - name: tags
            expression: "variables.aws != null && has(variables.aws.sessionTags) ? variables.aws.sessionTags : []"
        validations:
          - expression: "!variables.tenantNamespace || variables.tenantRole"
            message: Tenant SecretStores must use the AWS provider with the Runway tenant secrets role.
          - expression: >-
              !variables.tenantRole || (
                variables.tenantNamespace &&
                'opspresso.com/delivery-project' in variables.labels &&
                'opspresso.com/delivery-env' in variables.labels &&
                namespaceObject.metadata.name == 'app-' + variables.labels['opspresso.com/delivery-project'] + '-' + variables.labels['opspresso.com/delivery-env'] &&
                size(variables.tags) == 2 &&
                variables.tags.exists(t, t.key == 'delivery-project' && t.value == variables.labels['opspresso.com/delivery-project']) &&
                variables.tags.exists(t, t.key == 'delivery-env' && t.value == variables.labels['opspresso.com/delivery-env'])
              )
            message: The Delivery tenant secrets role is only valid in namespace app-<project>-<env> with session tags equal to its Delivery labels.
    - |
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: delivery-tenant-secret-stores
      spec:
        policyName: delivery-tenant-secret-stores
        validationActions: [Deny]
    - |
      # A Workflow from Runway runs a reviewed WorkflowTemplate with parameters only. Any other spec field could
      # replace the steps (templates), the identity (serviceAccountName) or the Pod (podSpecPatch, volumes).
      # The checkout token Secret is the only Secret Runway creates: <workflow>-checkout, owned by that Workflow.
      {{- $s := .Values.global.delivery.submissions }}
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicy
      metadata:
        name: runway-delivery-submissions
      spec:
        failurePolicy: Fail
        matchConstraints:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "global.delivery.submissions.namespace is required" $s.namespace | quote }}
          resourceRules:
            - apiGroups: [argoproj.io]
              apiVersions: ["*"]
              operations: [CREATE, UPDATE]
              resources: [workflows]
            - apiGroups: [""]
              apiVersions: ["*"]
              operations: [CREATE, UPDATE]
              resources: [secrets]
        matchConditions:
          - name: runway
            expression: {{ printf "request.userInfo.username == '%s'" (required "global.delivery.submissions.user is required" $s.user) | quote }}
        variables:
          - name: workflow
            expression: "request.resource.resource == 'workflows'"
          - name: spec
            expression: "variables.workflow && has(object.spec) ? object.spec : {}"
        validations:
          - expression: "!variables.workflow || variables.spec.all(k, k in ['workflowTemplateRef', 'arguments'])"
            messageExpression: "'Runway Workflows may set only spec.workflowTemplateRef and spec.arguments, not: ' + variables.spec.filter(k, !(k in ['workflowTemplateRef', 'arguments'])).join(', ')"
          - expression: >-
              !variables.workflow || (
                has(variables.spec.workflowTemplateRef) &&
                variables.spec.workflowTemplateRef.all(k, k == 'name') &&
                variables.spec.workflowTemplateRef.name in {{ required "global.delivery.submissions.workflowTemplates is required" $s.workflowTemplates | toJson | replace "\"" "'" }}
              )
            message: {{ printf "Runway Workflows must reference one of the namespaced WorkflowTemplates %s by name." (join ", " $s.workflowTemplates) | quote }}
          - expression: "!variables.workflow || !has(variables.spec.arguments) || variables.spec.arguments.all(k, k == 'parameters')"
            message: Runway Workflow arguments may carry parameters only.
          - expression: >-
              variables.workflow || (
                object.metadata.name.endsWith('-checkout') &&
                has(object.metadata.ownerReferences) &&
                object.metadata.ownerReferences.exists(r,
                  r.apiVersion == 'argoproj.io/v1alpha1' && r.kind == 'Workflow' && object.metadata.name == r.name + '-checkout')
              )
            message: Runway creates only <workflow>-checkout Secrets owned by that Workflow.
    - |
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingAdmissionPolicyBinding
      metadata:
        name: runway-delivery-submissions
      spec:
        policyName: runway-delivery-submissions
        validationActions: [Deny]
