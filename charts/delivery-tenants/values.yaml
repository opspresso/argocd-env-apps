# The admission policies that keep the Runway tenant secrets role inside its own Project namespace and
# narrow the Workflows Agent Runway submits. argocd-env-projects charts/app creates the namespaces
# app-<project>-<env> and their SecretStores (agent-platform docs/APP_DELIVERY.md).
#
# raw renders the policies as raw.resources in values-template.yaml.j2: the tenant policy carries the
# cluster's role ARN, and Helm replaces a values list instead of merging it.
