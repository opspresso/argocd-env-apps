app:
  fullnameOverride: agent-runway
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-runway
    tag: latest
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
  service:
    name: http
    port: 3000
    targetPort: 3000
  controller:
    strategy:
      rollingUpdate:
        maxSurge: 100%
        maxUnavailable: 0
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/ready
      port: 3000
    initialDelaySeconds: 5
    timeoutSeconds: 6
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    timeoutSeconds: 2
    initialDelaySeconds: 10
    periodSeconds: 10
  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    timeoutSeconds: 2
    periodSeconds: 5
    failureThreshold: 60
  # preStop 15s + in-flight provisioning requests (bounded at 30s) + headroom.
  terminationGracePeriodSeconds: 60
  lifecycle:
    preStop:
      exec:
        command:
        - /bin/sh
        - -c
        - sleep 15
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 2
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  serviceMonitor:
    enabled: false
    endpoints:
    - interval: 15s
      path: /metrics
      port: http
      authorization:
        type: Bearer
        credentials:
          name: agent-runway-metrics
          key: token
  routing:
    httpRoute:
      parentRefs:
      - name: istio-ingressgateway
        namespace: istio-system
  serviceAccount:
    create: true
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: secrets-manager
  ecrPullSecret:
    enabled: true
    region: ap-northeast-2
  # Delivery submits app Deliveries to Argo Workflows through the Kubernetes API (argocd-env-projects
  # charts/delivery grants its ServiceAccount a Role in namespace app-delivery).
  automountServiceAccountToken: true
  networkPolicy:
    enabled: true
    appPort:
      sameNamespace: true
      # Studio calls the MCP endpoint; Forge materializes dev variables at Run start.
      namespaces:
      - agent-studio
      - agent-forge
    ingress:
    # Prometheus scrapes the Istio sidecar's Envoy stats on 15090 (PodMonitor istio-system/istio-sidecars).
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: addon-prometheus
      ports:
      - protocol: TCP
        port: 15090
