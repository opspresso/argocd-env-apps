app:
  fullnameOverride: agent-runway
  raw:
    enabled: True

  replicaCount: 1
  autoscaling:
    enabled: True
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-runway

  configmap:
    enabled: true
    data:
      DATABASE_POOL_SIZE: '4'
      AUTH_BASE_URL: https://runway.agrt.dev
      OIDC_ISSUER: https://studio.agrt.dev/api/auth
      OIDC_PROVIDER_ID: studio
      AWS_REGION: ap-northeast-2
      RUNWAY_CLUSTER: eks-demo
      RUNWAY_SECRET_STORE: ssm
      RUNWAY_KMS_KEY_ID: alias/agent-runway
      RUNWAY_POOL_HOST: postgres.delivery-pool.svc.cluster.local
      RUNWAY_POOL_PORT: '5432'
      RUNWAY_BUCKET: agent-runway-objects
      RUNWAY_SANDBOX_OBJECTS_ROLE_ARN: arn:aws:iam::396608815058:role/agent-runway-sandbox-objects
      RUNWAY_TENANT_OBJECTS_ROLE_ARN: arn:aws:iam::396608815058:role/agent-runway-tenant-objects
      RUNWAY_EKS_CLUSTER: eks-demo
      # The image registry app-build pushes to (charts/delivery registry); a deleted Project's repository there is removed.
      RUNWAY_IMAGE_REGISTRY: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/projects

      # App Delivery uses the app-build and app-deploy WorkflowTemplates (agent-platform docs/APP_DELIVERY.md).
      # The retired RUNWAY_WORKFLOW_TEMPLATE setting is rejected at startup.
      # The service account CA lets fetch trust the API server.
      RUNWAY_WORKFLOW_NAMESPACE: app-delivery
      RUNWAY_APP_DOMAIN: apps.rovr.dev
      RUNWAY_ARGOCD_URL: https://argocd.demo.opsp.dev
      # Sandbox Pods may reach the sandbox environment's postgres and valkey servers.
      RUNWAY_SANDBOX_NAMESPACE: agent-forge-workspaces
      RUNWAY_ENVIRONMENTS: '[{"approval": "none", "deployOn": {"branches": ["main"]}, "name": "dev", "primary": false, "requiresPrevious": false, "sandbox": true}, {"approval": "owner", "deployOn": {"tags": ["v*"]}, "name": "prod", "primary": true, "requiresPrevious": true, "sandbox": false}]'
      # The GitHub App's URL name, for the console's install link (Agent Runway v0.45.0 or later).
      RUNWAY_GITHUB_APP_SLUG: agrt-dev
      NODE_EXTRA_CA_CERTS: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

  externalSecrets:
    enabled: true
    data:
    - key: /k8s/eks-demo/agent-platform/database-url
      name: DATABASE_URL
    - key: /k8s/eks-demo/agent-runway/auth-secret
      name: AUTH_SECRET
    - key: /k8s/eks-demo/agent-runway/oidc-client-id
      name: OIDC_CLIENT_ID
    - key: /k8s/eks-demo/agent-runway/oidc-client-secret
      name: OIDC_CLIENT_SECRET
    - key: /k8s/eks-demo/agent-runway/pool-database-url
      name: RUNWAY_POOL_DATABASE_URL
    - key: /k8s/eks-demo/agent-runway/metrics-bearer-token
      name: METRICS_BEARER_TOKEN
    - key: /k8s/eks-demo/agent-runway/github-app-id
      name: RUNWAY_GITHUB_APP_ID
    - key: /k8s/eks-demo/agent-runway/github-app-private-key
      name: RUNWAY_GITHUB_APP_PRIVATE_KEY
    # The App's webhook secret signs the pushes it sends to /api/webhooks/github (Agent Runway v0.45.0 or later).
    - key: /k8s/eks-demo/agent-runway/github-webhook-secret
      name: RUNWAY_GITHUB_WEBHOOK_SECRET
  routing:
    hosts:
    - runway.agrt.dev
    httpRoute:
      enabled: true
  # Every eks-demo node is Spot. Spread the replicas over AZs and nodes so one reclaim leaves a replica serving.
  # ScheduleAnyway: a replica still starts when one AZ has no Spot capacity.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-runway
      matchLabelKeys: [pod-template-hash]
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: agent-runway
      matchLabelKeys: [pod-template-hash]
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://runway.agrt.dev
  ingressPeers:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: istio-system
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: addon-prometheus
  ssmPrefix: /k8s/eks-demo
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
  registry:
    region: ap-northeast-2



# The apps Agent Runway deploys (agent-platform docs/APP_DELIVERY.md). argocd-env-addons keeps only the AppProjects.
raw:
  resources:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        namespace: argocd
        annotations:
          # Agent Runway's own removal must never reach the Applications below and their app data.
          argocd.argoproj.io/sync-options: Delete=false,Prune=false
        name: app-delivery
        labels:
          opspresso.com/cluster: "eks-demo"
          opspresso.com/group: "projects"
      spec:
        project: delivery
        destination:
          name: "eks-demo"
          namespace: app-delivery
        source:
          repoURL: https://github.com/opspresso/argocd-env-projects.git
          targetRevision: HEAD
          path: charts/delivery
          helm:
            valuesObject:
              registry: "396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/projects"
              pushRoleArn: "arn:aws:iam::396608815058:role/app-delivery-push"
              region: "ap-northeast-2"
              apiServer:
                cidrs: ["172.20.0.1/32", "10.10.114.40/32", "10.10.149.55/32"]
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

    # One Application per projects/<slug>/<env> directory of an allowed environment. Project, environment, namespace
    # and host come from the directory path and the environment profile of this cluster, not from the files, and the
    # charts/app guard checks them. A values file could still turn the guard off: the boundary is that only the
    # app-deploy step writes app.yaml, through the fixed render.jq mapping, with a deploy key that only the delivery-git
    # steps hold. The Application syncs the app chart with app.yaml (tenant objects only until the first deployment)
    # and the kro instances in resources.yaml.
    - apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        namespace: argocd
        annotations:
          # Agent Runway's own removal must never reach the Applications below and their app data.
          argocd.argoproj.io/sync-options: Delete=false,Prune=false
        name: projects
      spec:
        goTemplate: true
        goTemplateOptions: ["missingkey=error"]
        generators:
          - git:
              repoURL: https://github.com/opspresso/argocd-env-projects.git
              revision: HEAD
              requeueAfterSeconds: 30
              directories:
                - path: "projects/*/dev"
                - path: "projects/*/prod"
        template:
          metadata:
            name: 'app-{{ index .path.segments 1 }}-{{ .path.basename }}'
            labels:
              opspresso.com/cluster: "eks-demo"
              opspresso.com/group: "projects"
              opspresso.com/delivery-project: '{{ index .path.segments 1 }}'
              opspresso.com/delivery-env: '{{ .path.basename }}'
          spec:
            project: projects
            destination:
              name: "eks-demo"
              namespace: 'app-{{ index .path.segments 1 }}-{{ .path.basename }}'
            sources:
              - repoURL: https://github.com/opspresso/argocd-env-projects.git
                targetRevision: HEAD
                path: charts/app
                helm:
                  valueFiles:
                    - '../../{{ .path.path }}/app.yaml'
                  # resources.yaml may come before the first deployment writes app.yaml.
                  ignoreMissingValueFiles: true
                  # charts/app wraps the opspresso app chart; its guard refuses any other environment, namespace or host.
                  parameters:
                    - name: app.tenant.project
                      value: '{{ index .path.segments 1 }}'
                    - name: app.tenant.environment
                      value: '{{ .path.basename }}'
                    - name: app.tenant.environments
                      value: "dev prod"
                    - name: app.tenant.primaryEnvironment
                      value: "prod"
                    - name: app.tenant.domain
                      value: "apps.rovr.dev"
                    - name: app.tenant.cluster
                      value: "eks-demo"
                    - name: app.tenant.region
                      value: "ap-northeast-2"
                    - name: app.tenant.tenantSecretsRoleArn
                      value: "arn:aws:iam::396608815058:role/agent-runway-tenant-secrets"
                    - name: app.routing.hosts[0]
                      value: '{{ if eq .path.basename "prod" }}{{ index .path.segments 1 }}{{ else }}{{ index .path.segments 1 }}-{{ .path.basename }}{{ end }}.apps.rovr.dev'
                    # The environment namespace is an object of charts/app (app.namespace), so Argo CD deletes it with
                    # the Application; its guard checks that these labels name this project and environment.
                    - name: app.namespace.labels.opspresso\.com/delivery-project
                      value: '{{ index .path.segments 1 }}'
                    - name: app.namespace.labels.opspresso\.com/delivery-env
                      value: '{{ .path.basename }}'
              # The namespaced resources (kro instances) that resource-sync writes; AppProject projects limits the kinds.
              - repoURL: https://github.com/opspresso/argocd-env-projects.git
                targetRevision: HEAD
                path: '{{ .path.path }}'
                directory:
                  include: resources.yaml
            # No CreateNamespace: Argo CD never deletes a namespace that option made, so a removed Project left its
            # app-<slug>-<env> namespace behind. charts/app renders the namespace with the tenant labels instead.
            syncPolicy:
              automated:
                prune: true
                selfHeal: true

    # One Application per dedicated chart resource: the postgres or valkey chart of opspresso/helm-charts at the version
    # in projects/<slug>/<env>/resources/<name>.yaml, with that file as its values. Project, environment and namespace come
    # from the path. resource-sync writes the file and checks the chart, version and value names. The Application of the
    # environment creates the namespace, so a first sync may fail and retries. The finalizer removes the workload and,
    # through the StatefulSet retention policy, its volumes when the file goes.
    - apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        namespace: argocd
        annotations:
          # Agent Runway's own removal must never reach the Applications below and their app data.
          argocd.argoproj.io/sync-options: Delete=false,Prune=false
        name: project-resources
      spec:
        goTemplate: true
        goTemplateOptions: ["missingkey=error"]
        generators:
          - git:
              repoURL: https://github.com/opspresso/argocd-env-projects.git
              revision: HEAD
              requeueAfterSeconds: 30
              files:
                - path: "projects/*/dev/resources/*.yaml"
                - path: "projects/*/prod/resources/*.yaml"
        template:
          metadata:
            name: 'app-{{ index .path.segments 1 }}-{{ index .path.segments 2 }}-{{ trimPrefix (printf "%s-" (index .path.segments 1)) .resourceName }}-{{ trunc 8 .resourceId }}'
            labels:
              opspresso.com/cluster: "eks-demo"
              opspresso.com/group: "projects"
              opspresso.com/delivery-project: '{{ index .path.segments 1 }}'
              opspresso.com/delivery-env: '{{ index .path.segments 2 }}'
            finalizers:
              - resources-finalizer.argocd.argoproj.io
          spec:
            project: projects
            destination:
              name: "eks-demo"
              namespace: 'app-{{ index .path.segments 1 }}-{{ index .path.segments 2 }}'
            sources:
              - repoURL: https://opspresso.github.io/helm-charts
                chart: '{{ .chart }}'
                targetRevision: '{{ .chartVersion }}'
                helm:
                  releaseName: '{{ .resourceName }}'
                  valueFiles:
                    - '$values/{{ .path.path }}/{{ .path.filename }}'
                  parameters:
                    # Reclaim policy Delete: deleting a resource does not leave a billed volume behind.
                    - name: persistence.storageClass
                      value: gp3-ephemeral
              - repoURL: https://github.com/opspresso/argocd-env-projects.git
                targetRevision: HEAD
                ref: values
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              retry:
                limit: 10
                backoff:
                  duration: 30s
                  factor: 2
                  maxDuration: 5m
